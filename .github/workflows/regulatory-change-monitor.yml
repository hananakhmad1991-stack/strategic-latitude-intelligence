name: SLI Regulatory Change and Policy News Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '13 1,11 * * *'
  push:
    paths:
      - 'scripts/monitor_regulatory_policy.py'
      - 'scripts/validate_regulatory_monitor.py'
      - 'data/regulatory-monitor-sources.json'
      - '.github/workflows/regulatory-change-monitor.yml'
permissions:
  contents: write
concurrency:
  group: regulatory-change-monitor-main
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install monitor dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Check monitor Python syntax
        run: python -m py_compile scripts/monitor_regulatory_policy.py scripts/validate_regulatory_monitor.py
      - name: Scan official law registers and policy news
        run: python scripts/monitor_regulatory_policy.py
      - name: Validate monitoring provenance and no false legal-status changes
        run: python scripts/validate_regulatory_monitor.py
      - name: Publish dated candidate monitor snapshot to GitHub Pages source data
        run: |
          git config user.name "sli-policy-monitor[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/regulatory-monitor.json
          if git diff --cached --quiet; then
            echo "No monitoring changes"
            exit 0
          fi
          git commit -m "data: scheduled regulatory source health and change-candidate snapshot [skip ci]"
          # Preserve other concurrent SLI commits: only rebase the one-file monitoring
          # snapshot if upstream advanced without touching this file. If another monitor
          # changed the same JSON, stop rather than silently replacing its baseline.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Concurrent changes conflict with monitor data; next run will rescan"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published latest monitoring snapshot on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Monitoring snapshot generated but push kept racing; retry next scheduled run"
          exit 1
