name: SLI Secondary News Intelligence Index
on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_secondary_news_index.py"
      - "tests/test_secondary_news_index.py"
      - ".github/workflows/sli-secondary-news-index.yml"
permissions:
  contents: write
concurrency:
  group: sli-secondary-news-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ingestion QA
        run: |
          python -m py_compile scripts/build_secondary_news_index.py
          python tests/test_secondary_news_index.py
      - name: Ingest all 11 monitored SLI news and source-detection feeds
        run: python scripts/build_secondary_news_index.py
      - name: Commit refreshed secondary research index
        run: |
          set -eu
          cp data/sli-secondary-news-index.json /tmp/sli-secondary-news-index.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/sli-secondary-news-index.json data/sli-secondary-news-index.json
            git add data/sli-secondary-news-index.json
            if git diff --cached --quiet; then
              echo "Secondary index unchanged"
              exit 0
            fi
            git commit -m "Update SLI attributed secondary news evidence archive"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
