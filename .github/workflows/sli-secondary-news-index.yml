# SLI monitoring recovery: 2026-11-24; source checks and validation retained.
name: SLI Secondary News Intelligence Index
on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/build_secondary_news_index.py"
      - "tests/test_secondary_news_index.py"
      - "scripts/build_catalyst_history.mjs"
      - "tests/catalyst-history-qa.mjs"
      - "data/sli-catalyst-state.json"
      - ".github/workflows/sli-secondary-news-index.yml"
permissions:
  contents: write
concurrency:
  group: sli-secondary-news-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ingestion QA
        run: |
          python -m py_compile scripts/build_secondary_news_index.py
          python tests/test_secondary_news_index.py
      - name: Ingest all configured monitoring and source-detection feeds
        run: python scripts/build_secondary_news_index.py
      - name: Validate shared Catalyst history generator
        run: |
          node --check scripts/build_catalyst_history.mjs
          node tests/catalyst-history-qa.mjs
      - name: Commit refreshed news and shared Catalyst history
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_secondary_news_index.py
            node scripts/build_catalyst_history.mjs
            git add data/sli-secondary-news-index.json data/sli-catalyst-state.json data/sli-catalyst-history.json
            if git diff --cached --quiet; then
              echo "News index and Catalyst history unchanged"
              exit 0
            fi
            git commit -m "Update SLI news and shared source-dated Catalyst history"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
