name: SLI Unified Research Evidence Sync & Review
on:
  workflow_dispatch:
  schedule:
    - cron: "23 2,8,14,20 * * *"
  push:
    paths:
      - 'scripts/build_research_unified_index.py'
      - 'scripts/sli_research_source_adapters.py'
      - 'research-api/src/claim-evidence-audit.mjs'
      - 'tests/qa-sli-claim-audit.mjs'
      - 'research-api/src/primary-claim-probe.mjs'
      - 'tests/qa-sli-primary-claim-probe.mjs'
      - 'scripts/audit_sli_research_index.py'
      - 'research-api/src/dashboard-corpus.mjs'
      - 'research-api/src/owner-test-worker.mjs'
      - 'data/sli-research-project-stage-baseline.json'
      # Source-linked intelligence feeds omitted from the original push watch.
      # Without these triggers a fresh dataset makes the owner Worker index stale.
      - 'data/geopolitical-energy.json'
      - 'data/sli-catalyst-history.json'
      - 'data/sli-issuer-news.json'
      - 'data/sli-marine-fisheries-kkp.json'
      - 'data/sli-kkp-portal-screened-2024.json'
      - 'data/sli-kkp-regional-historical-2019-2024.json'
      - 'data/sli-kkp-hatchery-province-cards-2024.json'
      - 'tests/test_sli_kkp_hatchery_card_bridge.py'
      - 'tests/test_sli_kkp_historical_research.py'
      - 'tests/test_sli_kkp_research_bridge.py'
      - 'data/sli-bps-agri-horti-2026-source-register.json'
      - 'data/sli-food-impact-source-leads-september-2026.json'
      - '.github/workflows/sli-unified-research-sync.yml'
  pull_request:
    paths:
      - 'scripts/build_research_unified_index.py'
      - 'scripts/sli_research_source_adapters.py'
      - 'research-api/src/claim-evidence-audit.mjs'
      - 'tests/qa-sli-claim-audit.mjs'
      - 'research-api/src/primary-claim-probe.mjs'
      - 'tests/qa-sli-primary-claim-probe.mjs'
      - 'scripts/audit_sli_research_index.py'
      - 'research-api/src/dashboard-corpus.mjs'
      - 'research-api/src/owner-test-worker.mjs'
      - 'data/sli-research-project-stage-baseline.json'
      # Source-linked intelligence feeds omitted from the original push watch.
      # Without these triggers a fresh dataset makes the owner Worker index stale.
      - 'data/geopolitical-energy.json'
      - 'data/sli-catalyst-history.json'
      - 'data/sli-issuer-news.json'
      - 'data/sli-marine-fisheries-kkp.json'
      - 'data/sli-kkp-portal-screened-2024.json'
      - 'data/sli-kkp-regional-historical-2019-2024.json'
      - 'data/sli-kkp-hatchery-province-cards-2024.json'
      - 'tests/test_sli_kkp_hatchery_card_bridge.py'
      - 'tests/test_sli_kkp_historical_research.py'
      - 'tests/test_sli_kkp_research_bridge.py'
      - 'data/sli-bps-agri-horti-2026-source-register.json'
      - 'data/sli-food-impact-source-leads-september-2026.json'
      - '.github/workflows/sli-unified-research-sync.yml'
permissions:
  contents: write
  issues: write
concurrency:
  group: sli-unified-research-index-${{ github.ref }}
  cancel-in-progress: false
jobs:
  index-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate source-linked evidence and audit changes
        run: |
          python scripts/build_research_unified_index.py
          python scripts/audit_sli_research_index.py
          python - <<'PY'
          import json
          p=json.load(open("data/sli-research-unified-index.json",encoding="utf-8"))
          hits=[x for x in p["records"] if x.get("dataset")=="sli-marine-fisheries-kkp.json"]
          assert len(hits)==28, f"KKP historical or provincial observations missing from DERGUBA index: {len(hits)} indexed"
          for indicator in ["Seaweed grow-out aquaculture production","Total grow-out aquaculture production","Marine capture fishers"]:
              assert any(indicator in x["title"] and "2024" in x["title"] and "portaldata.kkp.go.id" in x["source_url"] for x in hits), indicator
          assert sum("province_seaweed_2024" in x["path"] for x in hits)==10, "KKP province source evidence incomplete"
          assert not any("2025" in x["title"] for x in hits), "Estimated KKP 2025 accidentally promoted into observed corpus"
          regional=[x for x in p["records"] if x.get("dataset")=="sli-kkp-portal-screened-2024.json"]
          assert len(regional)==34, f"KKP detailed 2024 Research AI bridge incomplete: {len(regional)}"
          assert sum("seed_district_top_rows" in x["path"] for x in regional)==10
          assert sum("seed_species" in x["path"] for x in regional)==12
          assert all("2024" in x["title"] and "portaldata.kkp.go.id" in x["source_url"] for x in regional)
          print("KKP 2024 district+province+species Research AI records:",len(regional))
          history=[x for x in p["records"] if x.get("dataset")=="sli-kkp-regional-historical-2019-2024.json"]
          assert len(history)==36, f"KKP six-year regional evidence not fully indexed: {len(history)}"
          assert all("portaldata.kkp.go.id" in x["source_url"] and x["period"] in [str(y) for y in range(2019,2025)] for x in history)
          assert not any("2025" in x["title"] or "2026" in x["title"] for x in history)
          hatchery_cards=[x for x in p["records"] if x.get("dataset")=="sli-kkp-hatchery-province-cards-2024.json"]
          assert len(hatchery_cards)==6, f"Partial 2024 province hatchery source facts missing: {len(hatchery_cards)}"
          assert any("719750" in x["text"] for x in hatchery_cards), "KKP hatchery observed national gap not disclosed"
          assert all(x["period"]=="2024" and "portaldata.kkp.go.id" in x["source_url"] for x in hatchery_cards)
          print("KKP 2024 partial 33-province hatchery snapshot evidence:",len(hatchery_cards))
          print("KKP 2019-2024 historic regional evidence records:",len(history))
          print("KKP research retrieval indexed:",len(hits),"dated official source-linked records")
          food=[x for x in p["records"] if x.get("dataset")=="sli-food-impact-source-leads-september-2026.json"]
          assert len(food)==22, f"September 2026 Pusdatin sources missing from DERGUBA: {len(food)}"
          assert all(x["period"]=="2026-09-23" and "period=2026-08" in x["text"] and "satudata.pertanian.go.id" in x["source_url"] for x in food)
          print("Pusdatin September 2026 evidence indexed:",len(food),"source-linked dated records")
          bps=[x for x in p["records"] if x.get("dataset")=="sli-bps-agri-horti-2026-source-register.json"]
          assert len(bps)==16, f"BPS agriculture/horticulture 2025-26 metadata missing from DERGUBA: {len(bps)}"
          assert all("metadata_only_rights_pending_no_numeric_claim" in x["text"] for x in bps)
          assert any("hortikultura" in x["title"].lower() for x in bps)
          assert any("perikanan" in x["title"].lower() for x in bps)
          print("BPS table references indexed:",len(bps),"rights-gated catalogue leads; no republished numeric cells")
          PY
          node --check research-api/src/dashboard-corpus.mjs
          node --check research-api/src/claim-evidence-audit.mjs
          node --check research-api/src/primary-claim-probe.mjs
          python -m py_compile scripts/sli_research_source_adapters.py
          python -m unittest discover -s tests -p 'test_sli_kkp_research_bridge.py' -v
          python -m unittest discover -s tests -p 'test_sli_kkp_historical_research.py' -v
          python -m unittest discover -s tests -p 'test_sli_kkp_hatchery_card_bridge.py' -v
          node --check research-api/src/owner-test-worker.mjs
          node --test tests/qa-sli-dashboard-corpus.mjs tests/qa-sli-claim-audit.mjs tests/qa-sli-primary-claim-probe.mjs
      - name: Explain actual coverage, not fake fact verification
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          c=json.load(open('data/sli-research-unified-index.json'))['coverage']
          r=json.load(open('artifacts/sli-research-stage-review.json'))
          print('### Source-linked SLI dashboard retrieval')
          print('Records:',c['rows'],'Indexed datasets:',c['datasets_indexed'],'Datasets inspected:',c['datasets_scanned'])
          print('Project-stage differences needing primary-source review:',len(r['changes']))
          print('Indexed records are dated leads, not publisher-page or claim-level verification.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sli-unified-research-evidence-review
          path: |
            data/sli-research-unified-index.json
            artifacts/sli-research-stage-review.json
          retention-days: 14
      - name: Publish dated index only, preserving concurrent main updates
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "sli-research-index[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_research_unified_index.py
            python scripts/audit_sli_research_index.py
            git add data/sli-research-unified-index.json
            if git diff --cached --quiet; then echo "No new index changes"; break; fi
            git commit -m "data: sync source-linked public Research AI index [skip ci]"
            if git push origin HEAD:main; then echo "Published updated index"; break; fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep $((attempt * 4))
          done
      - name: Create one review issue when project's reported stage changes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess
          r=json.load(open('artifacts/sli-research-stage-review.json'))
          changes=r.get('changes',[])
          if not changes:
              print('No stage-review differences');raise SystemExit(0)
          marker='SLI_UNIFIED_STAGE_REVIEW_QUEUE'
          q=subprocess.run(['gh','issue','list','--state','open','--search',marker+' in:body','--json','number','--limit','30'],capture_output=True,text=True)
          if q.returncode:raise SystemExit('Issue lookup failed; avoid duplicate alerts')
          if json.loads(q.stdout):
              print('Existing review issue; no duplicate');raise SystemExit(0)
          lines=['Public source-linked project labels differ from pinned baseline. NOT verified.', '',
            'Do not promote changes automatically; review dated original operator/regulator releases.',
            '', '| Project | Approved baseline | New candidate |', '|---|---|---|']
          for c in changes[:25]:
              cell=lambda x:str(x).replace('|','/').replace('\n',' ')[:130]
              lines.append('| '+cell(c['project_id'])+' | '+cell(c['approved_stage'])+' | '+cell(c['candidate_stage'])+' |')
          lines+=['','The Research AI index suppresses automatic promotion of changed labels.',marker]
          cmd=['gh','issue','create','--title','Research AI: review project-stage changes against primary sources','--body','\n'.join(lines)]
          ret=subprocess.run(cmd,capture_output=True,text=True)
          if ret.returncode:raise SystemExit(ret.stderr)
          print(ret.stdout)
          PY
