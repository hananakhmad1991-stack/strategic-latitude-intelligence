name: SLI Data Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**/*.json'
      - 'scripts/build_data_inventory.py'
      - '.github/workflows/sli-data-inventory.yml'
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
concurrency:
  group: sli-data-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count committed JSON without fabricating verified indicators
        run: python scripts/build_data_inventory.py
      - name: Commit inventory if changed
        run: |
          git add data/sli-data-inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh SLI inventory"
          git push
