# Recovery refresh 2026-11-24; reconcile current source snapshots.
name: SLI Data Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**/*.json'
      - 'scripts/build_data_inventory.py'
      - '.github/workflows/sli-data-inventory.yml'
  schedule:
    - cron: '17 1 * * *'
permissions:
  contents: write
concurrency:
  group: sli-data-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Count committed JSON without fabricating verified indicators
        run: python scripts/build_data_inventory.py
      - name: Commit inventory if changed
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_data_inventory.py
            python -m json.tool data/sli-data-inventory.json > /dev/null
            git add data/sli-data-inventory.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh SLI sli-data-inventory"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
