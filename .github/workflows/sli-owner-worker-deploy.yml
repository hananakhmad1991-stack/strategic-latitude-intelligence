name: SLI owner Worker · controlled deployment
on:
  pull_request:
    paths:
      - 'research-api/**'
      - 'scripts/sli-research-owner-readiness.mjs'
      - 'tests/qa-sli-owner-readiness.mjs'
      - 'tests/test_sli_research_index_source.py'
      - 'scripts/build_research_unified_index.py'
      - 'data/sli-research-unified-index.json'
      - 'data/sli-research-assistant-config.json'
      - 'data/sli-automation-health.json'
      - '.github/workflows/sli-owner-worker-deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Choose validation only or explicitly deploy the owner-only staging Worker
        type: choice
        required: true
        default: validate-only
        options:
          - validate-only
          - deploy-owner-staging

permissions:
  contents: read

jobs:
  policy-gate:
    name: Verify policy AI and owner scope
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate policy source and model boundaries
        run: |
          node --check research-api/src/owner-test-worker.mjs
          node --check research-api/src/legal-provisions.mjs
          node --check research-api/src/legal-source-limited.mjs
          node --check js/sli-legal-provisions.js
          node --check research-api/src/legal-citation-audit.mjs
          node --check research-api/src/policy-corpus.mjs
          node --test tests/qa-sli-policy-ai.mjs tests/qa-sli-legal-provisions.mjs tests/qa-sli-legal-source-limited.mjs tests/qa-sli-owner-deploy-snapshot.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate and audit evidence from current checkout without publishing
        id: index_verification
        run: |
          python -m unittest discover -s tests -p 'test_sli_research_index_source.py' -v
          python scripts/build_research_unified_index.py
          python scripts/audit_sli_research_index.py
          if git diff --quiet -- data/sli-research-unified-index.json; then
            echo 'source_index_fresh=true' >> "$GITHUB_OUTPUT"
            echo 'Committed index matches latest datasets.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'source_index_fresh=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Committed Research AI index differs from a reproducibly rebuilt, audited snapshot. Staging may use only the source-commit-pinned verified artifact; public index publication remains a separate workflow.'
            echo 'Committed Research AI index differs from the reproducibly rebuilt snapshot. **Any explicit owner staging deploy MUST use the audited index artifact from this run, with SHA-256 and source-commit checks. Public index synchronization remains separate.**' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve rebuilt index for safe reconciliation
        if: steps.index_verification.outputs.source_index_fresh == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: sli-owner-rebuilt-evidence-index
          path: data/sli-research-unified-index.json
          retention-days: 3
      - name: Audit Research AI security, source traces and report quality (offline)
        run: |
          node --check scripts/sli-research-owner-readiness.mjs
          node --test \
            tests/qa-sli-owner-readiness.mjs \
            tests/qa-sli-owner-test.mjs \
            tests/qa-sli-claim-audit.mjs \
            tests/qa-sli-claim-evidence-ledger.mjs \
            tests/qa-sli-primary-claim-probe.mjs \
            tests/qa-sli-source-verification.mjs \
            tests/qa-sli-hybrid-retrieval.mjs \
            tests/qa-sli-multi-api.mjs \
            tests/qa-sli-report-audit.mjs \
            tests/qa-sli-legal-source-limited.mjs
          node scripts/sli-research-owner-readiness.mjs --out=artifacts/sli-owner-research-readiness.json
      - name: Seal validated source-commit index for explicit Owner staging
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-owner-staging'
        run: |
          mkdir -p artifacts
          sha256sum data/sli-research-unified-index.json > artifacts/sli-owner-index.sha256
          printf '%s\n' "$GITHUB_SHA" > artifacts/sli-owner-source-sha.txt
          echo "Owner staging index snapshot SHA-256: $(cut -d ' ' -f1 artifacts/sli-owner-index.sha256)" >> "$GITHUB_STEP_SUMMARY"
          echo "Snapshot is not a certification of sources or a publish to the public index." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-owner-staging'
        with:
          name: sli-owner-validated-index-${{ github.run_id }}
          path: |
            data/sli-research-unified-index.json
            artifacts/sli-owner-index.sha256
            artifacts/sli-owner-source-sha.txt
          if-no-files-found: error
          retention-days: 3
      - name: Summarize owner-readiness limits and automation warnings
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='artifacts/sli-owner-research-readiness.json';
          if (!fs.existsSync(p)) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '### Owner Research staging\nNo readiness report produced: review failing tests.\n');
          } else {
            const r=JSON.parse(fs.readFileSync(p,'utf8'));
            const lines=[
              '### Owner Research staging (metadata and offline tests only)',
              '- Static owner-only gate: '+(r.owner_staging_code_gate_pass?'PASS':'BLOCKED'),
              '- Indexed evidence records: '+r.source_index_record_count,
              '- Index datasets: '+r.source_index_datasets_indexed,
              '- Data automation: '+r.automation_reported_health,
              '- Blockers: '+(r.blockers.join(', ')||'none'),
              '- Warnings: '+(r.warnings.join(', ')||'none'),
              '- **Live authenticated smoke: NOT CHECKED; scientific accuracy: NOT VERIFIED; paid launch: NOT APPROVED.**'
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,lines.join('\n')+'\n');
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sli-owner-research-offline-readiness
          path: artifacts/sli-owner-research-readiness.json
          if-no-files-found: ignore
          retention-days: 7

  deploy-owner-staging:
    needs: policy-gate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-owner-staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: sli-owner-staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download audited evidence snapshot from this exact run
        uses: actions/download-artifact@v4
        with:
          name: sli-owner-validated-index-${{ github.run_id }}
          path: .
      - name: Verify pinned source, index integrity, and deterministic audit before deploy
        run: |
          test "$(cat artifacts/sli-owner-source-sha.txt)" = "$GITHUB_SHA"
          sha256sum --check artifacts/sli-owner-index.sha256
          python scripts/build_research_unified_index.py --check
          python scripts/audit_sli_research_index.py
          echo "Owner staging is using only the validated same-run evidence snapshot."
      - name: Check Cloudflare deploy credentials are configured
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_DEPLOY_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets."
            exit 1
          fi
      - name: Deploy owner-only Worker (never deploy the Pro customer endpoint)
        working-directory: research-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler.owner-test.toml.example wrangler.toml
          npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify deployed Owner endpoint denies unauthenticated requests
        env:
          OWNER_ENDPOINT: https://sli-research-owner-test.hananakhmad1991.workers.dev/v1/owner-research
        run: |
          node --input-type=module <<'NODE'
          const endpoint=process.env.OWNER_ENDPOINT;
          const origin='https://hananakhmad1991-stack.github.io';
          if(!endpoint?.startsWith('https://')||new URL(endpoint).pathname!=='/v1/owner-research'){
            throw new Error('Invalid staging endpoint configuration');
          }
          const response=await fetch(endpoint,{
            method:'POST',redirect:'error',
            headers:{Origin:origin,'Content-Type':'application/json'},
            body:JSON.stringify({
              question:'Owner staging postdeploy authentication gate check',
              mode:'executive_summary',language:'id',history:[],methodology:'auto'
            }),
            signal:AbortSignal.timeout(25000)
          });
          const body=await response.json().catch(()=>({}));
          if(response.status!==401||body?.error!=='owner_authentication_required'){
            throw new Error('Owner staging unauthorized request was not strictly rejected: HTTP '+response.status);
          }
          console.log('OWNER STAGING LIVE SECURITY PASS: unauthenticated POST rejected (401).');
          NODE
      - name: Record deploy source commit and scientific validation boundary
        if: always()
        run: |
          echo "### Owner Worker deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git source commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: owner-only Cloudflare staging Worker" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live unauthenticated security gate: see prior step" >> "$GITHUB_STEP_SUMMARY"
          echo "- Paid authenticated model completion, source-claim truth and DOCX/PDF integrity: **NOT TESTED BY DEPLOYMENT**" >> "$GITHUB_STEP_SUMMARY"
      - name: Note independent smoke-test requirement
        run: |
          echo "Deployment submitted. Verify the owner-only endpoint with its existing Cloudflare-stored OWNER_TEST_TOKEN and current OPENAI_API_KEY secrets."
          echo "SLI legal Pasal corpus deployment requires authenticated smoke test of a correctly cited approved Pasal (for example PP 28/2025 Pasal 4) and rejection of an unreviewed Pasal."
          echo "No model completion or article-level legal accuracy has been certified by this action."
