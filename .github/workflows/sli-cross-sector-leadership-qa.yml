name: SLI Cross-Sector Leadership & Hierarchy QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/sli-cross-sector-official-leadership-2026.json'
      - 'js/sli-sector-leadership.js'
      - 'css/sli-sector-leadership.css'
      - 'data/sector-command-hierarchy.json'
      - 'data/food-governance-hierarchy.json'
      - 'data/energy-governance-ccs.json'
      - 'js/energy-hierarchy-adapter.js'
      - 'tests/qa-sli-cross-sector-leadership.mjs'
      - '.github/workflows/sli-cross-sector-leadership-qa.yml'
  push:
    branches: [main]
    paths:
      - 'data/sli-cross-sector-official-leadership-2026.json'
      - 'js/sli-sector-leadership.js'
      - 'data/sector-command-hierarchy.json'
      - 'tests/qa-sli-cross-sector-leadership.mjs'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --test tests/qa-sli-cross-sector-leadership.mjs
      - run: node --test tests/qa-command-hierarchy.mjs
      - run: node tests/check-institution-hierarchy.cjs
      - run: python scripts/validate_sector_hierarchy.py
