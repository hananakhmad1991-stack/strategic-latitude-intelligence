name: SLI CCS-CCUS Project Watch
on:
  workflow_dispatch:
  schedule:
    - cron: "49 */6 * * *"
  push:
    branches: [main]
    paths:
      - scripts/energy_ccs_watch.py
      - .github/workflows/energy-ccs-watch.yml
permissions:
  contents: write
concurrency:
  group: sli-ccs-watch
  cancel-in-progress: false
jobs:
  discover_public_projects:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover relevant public project updates
        run: python scripts/energy_ccs_watch.py
      - name: Validate and publish candidates
        run: |
          python -m json.tool data/energy-ccs-updates.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/energy-ccs-updates.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update CCS project lead watch"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
