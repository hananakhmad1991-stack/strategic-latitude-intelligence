name: Investment Market and Forbes Sources
on:
  schedule:
    - cron: '30 9 * * 1-5'
    - cron: '15 1 * * 0'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: investment-market-forbes-update
  cancel-in-progress: false
jobs:
  evidence-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source parser scripts
        run: python -m py_compile scripts/investment_market_refresh.py scripts/investment_forbes_monitor.py
      - name: Update BI exchange rate and delayed IHSG
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 9 * * 1-5'
        run: python scripts/investment_market_refresh.py
      - name: Monitor official Forbes annual list
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 1 * * 0'
        run: python scripts/investment_forbes_monitor.py
      - name: Publish refreshed, date-stamped source snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investment-market.json data/investment-forbes-top20.json
          if git diff --cached --quiet; then
            echo "No verified content changes."
            exit 0
          fi
          git commit -m "data: refresh validated investment market and Forbes source snapshots"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
