name: SLI Indonesia Power Profile QA
on:
  push:
    paths:
      - 'geopolitical-impact-assessment.html'
      - 'indonesia-investment-navigator.html'
      - 'js/sli-indonesia-power-profile.js'
      - 'data/sli-indonesia-power-profile.json'
      - 'index.html'
      - 'intelligence-labs.html'
      - 'tests/qa-indonesia-power-profile.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Lowy country profile rankings, measures, annual changes and bilateral influence
        run: node --test tests/qa-indonesia-power-profile.mjs
