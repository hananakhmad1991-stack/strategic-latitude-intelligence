# SLI monitoring recovery: 2026-11-24; source checks and validation retained.
name: Investment Media Monitoring
on:
  schedule:
    - cron: '24 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/investment-media.yml'
permissions:
  contents: write
concurrency:
  group: investment-media-monitoring
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan sourced investment RSS headlines
        run: python scripts/investment_news.py
      - name: Commit refreshed public-source snapshot
        run: |
          set -eu
          file="data/investment-news.json"
          if [ ! -s "$file" ]; then echo "No valid output"; exit 1; fi
          python -m json.tool "$file" > /dev/null
          snapshot=$(mktemp)
          cp "$file" "$snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" "$file"
            git add "$file"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh source-attributed investment-media snapshot"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
