name: Investment Media Monitoring
on:
  schedule:
    - cron: '24 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: investment-media-monitoring
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan sourced investment RSS headlines
        run: python scripts/investment_news.py
      - name: Commit refreshed public-source snapshot
        run: |
          if git diff --quiet -- data/investment-news.json && test -f data/investment-news.json; then
            echo "No news changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/investment-news.json
          git commit -m "data: refresh dated investment news RSS snapshot"
          git push
