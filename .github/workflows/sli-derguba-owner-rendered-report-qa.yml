name: SLI DERGUBA Owner Chrome PDF & Word Package QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/qa-sli-owner-rendered-report-browser.mjs'
      - 'scripts/verify_sli_owner_rendered_reports.py'
      - 'js/sli-report-content.mjs'
      - 'js/sli-report-pdf.mjs'
      - 'js/sli-report-docx.mjs'
      - 'research-api/src/legal-source-limited.mjs'
      - 'data/sli-verified-legal-provisions.json'
      - '.github/workflows/sli-derguba-owner-rendered-report-qa.yml'
  push:
    branches: [main]
    paths:
      - 'tests/qa-sli-owner-rendered-report-browser.mjs'
      - 'scripts/verify_sli_owner_rendered_reports.py'
      - 'js/sli-report-content.mjs'
      - 'js/sli-report-pdf.mjs'
      - 'js/sli-report-docx.mjs'
      - 'research-api/src/legal-source-limited.mjs'
      - 'data/sli-verified-legal-provisions.json'
      - '.github/workflows/sli-derguba-owner-rendered-report-qa.yml'
permissions:
  contents: read
jobs:
  rendered-report-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Chrome is present for real A4 print rendering
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME" || { echo "::error::Chrome missing; rendered QA cannot be certified"; exit 1; }
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install small PDF inspection library and Chromium driver
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock playwright-core@1.56.1
          python -m pip install --disable-pip-version-check --quiet pymupdf==1.26.5
      - name: Render SLI draft reports to actual Chromium A4 PDFs and editable Word
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/qa-sli-owner-rendered-report-browser.mjs
          node tests/qa-sli-owner-rendered-report-browser.mjs
      - name: Validate actual Chrome PDF pages and Word OOXML package, render PNG images
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_sli_owner_rendered_reports.py --ci-pdf-only
      - name: Preserve PDF, Word, screenshots, findings for owner inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sli-derguba-owner-rendered-reports
          path: |
            artifacts/sli-owner-rendered-reports/
            scripts/verify_sli_owner_rendered_reports.py
          retention-days: 14
          if-no-files-found: warn
      - name: Record limited acceptance scope
        if: always()
        shell: bash
        run: |
          echo '### DERGUBA Owner report QA boundary' >> "$GITHUB_STEP_SUMMARY"
          echo '- This job prints real Chromium A4 PDFs; verifies Word OOXML package, CRC and XML. LibreOffice rendering is a separate offline validation.' >> "$GITHUB_STEP_SUMMARY"
          echo '- It checks PDF text continuity, page images, Word file structure and synthetic source-bounded content.' >> "$GITHUB_STEP_SUMMARY"
          echo '- These artifacts are NOT the original authenticated owner response, nor proof of source correctness or a commercial release.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Human visual inspection of uploaded PNGs remains required.' >> "$GITHUB_STEP_SUMMARY"
