name: SLI Whole-Site Indonesian Content QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'js/i18n.js'
      - 'js/i18n-dictionary.js'
      - 'js/sli-navigation.js'
      - 'tests/qa-sitewide-indonesian-content.mjs'
      - '.github/workflows/sitewide-indonesian-qa.yml'
permissions:
  contents: read
jobs:
  editorial-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check translation sources
        run: |
          node --check js/i18n.js
          node --check js/i18n-dictionary.js
          node --check js/sli-navigation.js
      - name: Test Indonesian content throughout SLI
        run: |
          node --test tests/qa-sitewide-indonesian-content.mjs
          node tests/check-i18n.cjs
      - name: Publish bilingual editorial screening report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sli-indonesian-screening
          path: sli-i18n-screening.json
          if-no-files-found: ignore
          retention-days: 30
      - name: State translation limitations
        run: echo "Passing tests verifies homepage and source-controlled mappings, not all async prose or a human-reviewed browser session."
