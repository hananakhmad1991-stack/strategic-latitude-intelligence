name: SLI Whole-Site Indonesian Content QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'js/i18n.js'
      - 'js/i18n-dictionary.js'
      - 'js/sli-navigation.js'
      - 'tests/qa-sitewide-indonesian-content.mjs'
      - '.github/workflows/sitewide-indonesian-qa.yml'
permissions:
  contents: read
jobs:
  editorial-and-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check translation sources
        run: |
          node --check js/i18n.js
          node --check js/i18n-dictionary.js
          node --check js/sli-navigation.js
      - name: Test Indonesian content throughout SLI
        run: |
          node --test tests/qa-sitewide-indonesian-content.mjs
          node tests/check-i18n.cjs
      - name: Save English prose review candidates
        run: echo "See QA log for remaining source-language/editorial review queue; passed tests do not claim 100% translated content."
