name: SLI BPS welfare 2026 QA
on:
  pull_request:
    paths:
      - 'data/sli-bps-welfare-2026.json'
      - 'data/sli-bps-welfare-2026-reconciliation.json'
      - 'scripts/audit_bps_welfare_secondary_reader.py'
      - 'tests/test_bps_welfare_secondary_reader.py'
      - 'research-api/src/welfare-corpus.mjs'
      - 'research-api/src/owner-test-worker.mjs'
      - 'js/sli-bps-welfare-2026.js'
      - 'sli-welfare-2026.html'
      - 'js/sli-navigation.js'
      - 'sli-sector-data-library.html'
      - 'tests/qa-bps-welfare-2026.mjs'
      - 'scripts/audit_bps_welfare_2026.py'
      - 'tests/test_bps_welfare_2026_appendix_parser.py'
      - '.github/workflows/sli-bps-welfare-2026-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-welfare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser script syntax
        run: node --check js/sli-bps-welfare-2026.js
      - name: Check research-corpus syntax
        run: node --check research-api/src/welfare-corpus.mjs
      - name: Check Owner Worker syntax
        run: node --check research-api/src/owner-test-worker.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test BPS full appendix parser against synthetic pages
        run: |
          python -m py_compile scripts/audit_bps_welfare_2026.py
          python -m unittest discover -s tests -p 'test_bps_welfare_2026_appendix_parser.py' -v
      - name: Validate cross-PDF-engine parser discrepancy semantics
        run: |
          python -m py_compile scripts/audit_bps_welfare_secondary_reader.py
          python -m unittest discover -s tests -p 'test_bps_welfare_secondary_reader.py' -v
      - name: Check BPS welfare data and integration contracts
        run: node --test tests/qa-bps-welfare-2026.mjs
