name: SLI Geopolitical Timeline · World Bank Prices
on:
  workflow_dispatch:
  schedule:
    - cron: '35 2 * * *'
  push:
    paths:
      - 'scripts/sync_geopolitical_commodity_prices.py'
      - 'data/sli-geopolitical-events.json'
      - 'tests/qa-sli-geopolitics-chapter.mjs'
      - '.github/workflows/sli-geopolitical-commodity-timeline.yml'
permissions:
  contents: write
concurrency:
  group: sli-geopolitical-prices-v2
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook parser
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Update historic commodity monthly series
        run: python scripts/sync_geopolitical_commodity_prices.py
      - name: Validate event dates and series
        run: |
          python - <<'PY'
          import json
          from datetime import date
          e=json.load(open("data/sli-geopolitical-events.json"))
          p=json.load(open("data/sli-geopolitical-commodity-prices.json"))
          assert len(e["events"])>=15
          assert all("1950-01-01"<=x["date"]<=date.today().isoformat() and x["source_url"].startswith("https://") for x in e["events"])
          assert len(p["observations"])>=780
          assert p["observations"][0]["month"]=="1960-01"
          assert "wti" in p["series_coverage"]
          food=("rice_thai_5","wheat_us_hrw","maize","soybeans","palm_oil","sugar_world","urea")
          assert all(p["series_coverage"].get(k,{}).get("count",0)>=600 for k in food)
          assert all(p["observations"][-1].get(k,0)>0 for k in food)
          pres=e["presidential_transitions"]
          assert len(pres)==10 and len({x["date"] for x in pres})==10
          assert all(x["source_url"].startswith("https://") and x["statistical_event_eligible"] is False for x in pres)
          assert {x["president"] for x in pres if x["kind"] in ("president","regime")}=={"Soekarno","Soeharto","B. J. Habibie","Abdurrahman Wahid","Megawati Soekarnoputri","Susilo Bambang Yudhoyono","Joko Widodo","Prabowo Subianto"}
          assert len(p["series_coverage"])>=12
          assert len(set(x["month"] for x in p["observations"]))==len(p["observations"])
          assert p["latest_month"]==p["observations"][-1]["month"]
          PY
      - name: Publish new source observations when changed
        run: |
          if git diff --quiet -- data/sli-geopolitical-commodity-prices.json; then
            echo "Prices unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sli-geopolitical-commodity-prices.json
          git commit -m "data(geopolitics): refresh World Bank monthly commodity prices"
          git pull --rebase origin main
          git push origin HEAD:main
