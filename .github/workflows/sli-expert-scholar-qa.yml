name: SLI Expert Scholar Discovery QA
on:
  push:
    paths:
      - 'research-api/src/expert-scholar-discovery.mjs'
      - 'tests/qa-expert-scholar-discovery.mjs'
      - '.github/workflows/sli-expert-scholar-qa.yml'
  pull_request:
    paths:
      - 'research-api/src/expert-scholar-discovery.mjs'
      - 'tests/qa-expert-scholar-discovery.mjs'
      - '.github/workflows/sli-expert-scholar-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scholar-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check research-api/src/expert-scholar-discovery.mjs
      - name: Verify discovery and DOI safety contracts
        run: node --test tests/qa-expert-scholar-discovery.mjs
