name: SLI Macro World Bank Annual History
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 2'
  push:
    paths:
      - 'scripts/update_sli_macro_wdi.py'
      - 'data/sli-macro-worldbank-config.json'
      - '.github/workflows/macro-worldbank-history.yml'
permissions:
  contents: write
concurrency:
  group: sli-macro-worldbank-series
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install downloader
        run: python -m pip install --disable-pip-version-check requests
      - name: Fetch annual history and preserve earlier series on errors
        run: python scripts/update_sli_macro_wdi.py
      - name: Validate indicator schema and units
        run: python scripts/validate_sli_macro.py
      - name: Commit annual source series without rewriting current 2026 BPS/BI release snapshot
        run: |
          git config user.name "sli-macro-data[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sli-macro-worldbank-history.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "data: World Bank WDI annual macro history update [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "WDI series changed concurrently; preserve latest and rerun next schedule"
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
