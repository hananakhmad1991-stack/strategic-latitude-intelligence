name: SLI Geopolitical Energy News Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: "13 */3 * * *"
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gather attributed public news leads
        run: python scripts/geopolitical_energy_watch.py
      - name: Commit news-discovery snapshot if new
        run: |
          if [ ! -f data/geopolitical-energy.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/geopolitical-energy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update attributed geopolitical energy monitoring leads"
          git push
