name: SLI Commodity Trade Sankey QA
on:
  push:
    paths:
      - 'index.html'
      - 'js/commodity-trade-flow.js'
      - 'js/sli-sector-trade-sankey.js'
      - 'data/sli-marine-fisheries-trade-2025.json'
      - 'data/food-agriculture-2026.json'
      - 'food-agriculture-intelligence.html'
      - 'marine-fisheries-intelligence.html'
      - 'tests/qa-sli-sector-trade-sankeys.cjs'
      - 'css/commodity-trade-flow.css'
      - 'data/commodity-trade-flows.json'
      - 'data/bps-hs-partner-matrix.json'
      - 'scripts/import_bps_hs_partner.py'
      - 'tests/test_import_bps_hs_partner.py'
      - 'tests/qa-sli-bps-primary-trade.cjs'
      - 'tests/check-commodity-trade.cjs'
      - '.github/workflows/commodity-trade-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trade-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source-dated bilateral Sankey and interaction states
        run: |
          node --check js/commodity-trade-flow.js
          node --check js/sli-sector-trade-sankey.js
          node tests/check-commodity-trade.cjs
          node tests/qa-sli-sector-trade-sankeys.cjs
          node tests/qa-sli-bps-primary-trade.cjs
          python3 tests/test_import_bps_hs_partner.py
      - name: Validate homepage Trade Flows link and bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text(encoding="utf-8")
          for value in ['data-page="trade"', 'id="sliTradeRoot"', 'window.initSLITradeFlow()', 'js/commodity-trade-flow.js', 'css/commodity-trade-flow.css']:
              assert value in html, f"Missing trade navigation/mount: {value}"
          assert Path("data/commodity-trade-flows.json").exists()
          print("PASS: trade page routes and evidence dataset")
          PY
