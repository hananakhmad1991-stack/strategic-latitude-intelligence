name: SLI Owner Worker Bundle and Dataset Ledger QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research-api/**'
      - 'data/sli-user-dataset-recovery-inventory.json'
      - 'scripts/audit-sli-source-visibility.mjs'
      - '.github/workflows/sli-owner-bundle-data-ledger-qa.yml'
permissions:
  contents: read
jobs:
  offline-bundle-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle Owner Worker without deployment, tokens or secrets
        run: npx --yes esbuild@0.25.12 research-api/src/owner-test-worker.mjs --bundle --platform=browser --format=esm --target=es2022 --outfile=/tmp/sli-owner-worker-test.bundle.mjs
      - name: Source visibility and internal link audit
        run: node scripts/audit-sli-source-visibility.mjs
      - name: Preserve reconciliation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sli-dataset-status-ledger
          path: artifacts/sli-data-visibility-ledger.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Clearly distinguish Cloudflare provider build from local bundling
        run: echo "Offline bundling passed; independent Cloudflare dashboard Build failure remains to be resolved separately."
