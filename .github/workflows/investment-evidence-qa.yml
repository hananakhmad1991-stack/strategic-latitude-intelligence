name: Investment Evidence QA
on:
  push:
    paths:
      - 'data/investment-evidence.json'
      - 'data/investment-operator-assets.json'
      - 'data/investment-sector-evidence.json'
      - 'data/investment-ownership.json'
      - 'scripts/validate_investment.py'
      - 'js/investment-tracker.js'
      - 'js/investment-operator-assets.js'
      - 'js/investment-explorer.js'
      - 'js/investment-quality.js'
      - 'js/investment-ownership.js'
      - 'js/investment-sectors.js'
      - '.github/workflows/investment-evidence-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-investment-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check investment JavaScript syntax
        run: |
          for file in js/investment-tracker.js js/investment-operator-assets.js js/investment-explorer.js js/investment-quality.js js/investment-ownership.js js/investment-sectors.js; do
            node --check "$file"
          done
      - name: Check company-level source, BO and spending boundaries
        run: python scripts/validate_investment.py
