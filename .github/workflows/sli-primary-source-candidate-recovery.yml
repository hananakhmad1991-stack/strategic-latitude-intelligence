name: SLI Primary PDF & Environment Source Candidate Recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fetch-environment-wdi-review.py'
      - 'scripts/audit-ruptl-official-full-pdf.py'
      - '.github/workflows/sli-primary-source-candidate-recovery.yml'
permissions:
  contents: read
jobs:
  official-world-bank-environment:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve four WDI official annual indicators for Indonesia
        continue-on-error: true
        run: python3 scripts/fetch-environment-wdi-review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indonesia-environment-wdi-review-only
          path: artifacts/sli-indonesia-environment-wdi-review.json
          if-no-files-found: warn
          retention-days: 15
  pln-complete-ruptl:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF layout and page inspection utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Locate possible project-annex pages within PLN official 2025-2034 RUPTL
        continue-on-error: true
        run: python3 scripts/audit-ruptl-official-full-pdf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-pln-ruptl-page-index-review-only
          path: artifacts/sli-ruptl-full-project-page-candidates.json
          if-no-files-found: warn
          retention-days: 15
