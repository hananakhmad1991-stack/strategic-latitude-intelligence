name: SLI BNPB GIS District Events 2025 Source Review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/collect_bnpb_gis_district_2025_review.py'
      - '.github/workflows/sli-bnpb-gis-district-2025-review.yml'
permissions:
  contents: read
jobs:
  official-bnpb-2025-district-data-review:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Query exact named BNPB official ArcGIS layer 13 and audit original feature rows
        run: python3 scripts/collect_bnpb_gis_district_2025_review.py
      - name: Confirm candidate is NOT automatically published
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("artifacts/sli-bnpb-gis-district-2025-review.json").read_text())
          assert d["status"].endswith("not_yet_accepted_by_editor")
          assert len(d["records"])==d["record_count"]
          assert len({x["admin_code"] for x in d["records"]})==d["record_count"]
          assert d["record_count"]>=300
          for name in ("flood_events","landslide_events","extreme_weather_events"):
              assert any(type(x[name]) is int and x[name]>=0 for x in d["records"])
          print("BNPB_GIS2025_REVIEW_GATE_OK",d["record_count"])
          PY
      - name: Save official source candidate for evidence review only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sli-bnpb-gis-district-2025-review-only
          path: artifacts/sli-bnpb-gis-district-2025-review.json
          if-no-files-found: warn
          retention-days: 21
