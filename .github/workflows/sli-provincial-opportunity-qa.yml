name: SLI Provincial Opportunity and Stress QA
on:
  push:
    paths:
      - 'provincial-opportunity-engine.html'
      - 'js/sli-opportunity-engine.js'
      - 'data/sli-bps-regional-intelligence.json'
      - 'data/sli-bps-gini-2026.json'
      - 'data/sli-project-registry.json'
      - 'tests/qa-sli-provincial-opportunity.mjs'
      - '.github/workflows/sli-provincial-opportunity-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit BPS regional model, stress arithmetic, missingness, sources and visual interface
        run: node --test tests/qa-sli-provincial-opportunity.mjs
