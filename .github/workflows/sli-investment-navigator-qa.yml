name: SLI Investment Navigator QA
on:
  push:
    paths:
      - 'indonesia-investment-navigator.html'
      - 'js/sli-investment-navigator.mjs'
      - 'data/sli-indonesia-investment-navigator.json'
      - 'intelligence-labs.html'
      - 'index.html'
      - 'tests/qa-investment-navigator.mjs'
      - 'tests/qa-investment-navigator-runtime.mjs'
      - 'data/sli-market-editorial-policy.json'
      - 'data/sli-market-observations.json'
      - 'scripts/validate_market_feed.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/qa-investment-navigator.mjs tests/qa-investment-navigator-runtime.mjs
      - name: Verify market data provenance and distribution rights
        run: python3 scripts/validate_market_feed.py data/sli-market-observations.json
