name: SLI Research AI Evidence & Security QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'research-api/OWNER_TEST_SETUP.md'
      - 'tests/qa-sli-owner-test.mjs'
      - 'sli-research-ai.html'
      - 'sli-research-evidence-preview.html'
      - 'css/sli-research-assistant.css'
      - 'js/sli-research-assistant.js'
      - 'data/sli-research-assistant-config.json'
      - 'js/sli-research-ai.js'
      - 'js/sli-research-analysis.mjs'
      - 'data/sli-research-province-preview.json'
      - 'data/sli-research-evidence-preview.json'
      - 'research-api/**'
      - 'tests/qa-sli-research-conversation.mjs'
      - 'tests/qa-sli-research-ai.mjs'
      - 'tests/qa-sli-research-analysis.mjs'
      - 'js/sli-navigation.js'
      - '.github/workflows/sli-research-ai-qa.yml'
permissions:
  contents: read
jobs:
  evidence-research:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check research JavaScript syntax
        run: |
          node --check js/sli-research-assistant.js
          node --check research-api/src/assistant-core.mjs
          node --check js/sli-research-ai.js
          node --check js/sli-research-analysis.mjs
          node --check research-api/src/index.js
          node --check research-api/src/owner-test-worker.mjs
          node --check research-api/src/core.mjs
      - name: Validate open evidence, secure planned RAG and traceability
        run: node --test tests/qa-sli-owner-test.mjs tests/qa-sli-research-conversation.mjs tests/qa-sli-research-ai.mjs tests/qa-sli-research-analysis.mjs
