name: SLI Research AI Evidence & Security QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'research-api/OWNER_TEST_SETUP.md'
      - 'tests/qa-sli-owner-test.mjs'
      - 'sli-research-ai.html'
      - 'sli-research-evidence-preview.html'
      - 'css/sli-research-assistant.css'
      - 'css/sli-research-brand.css'
      - 'tests/qa-sli-research-brand.mjs'
      - 'js/sli-research-assistant.js'
      - 'js/sli-analytical-core.mjs'
      - 'js/sli-regional-method-engines.mjs'
      - 'tests/qa-sli-regional-method-engines.mjs'
      - 'js/sli-investor-chat.mjs'
      - 'js/sli-research-questionnaire.mjs'
      - 'examples/ahp-questionnaire-sample.csv'
      - 'tests/qa-sli-research-questionnaire.mjs'
      - 'tests/qa-sli-investor-chat.mjs'
      - 'js/sli-analytical-workbench-ui.mjs'
      - 'css/sli-analytical-workbench.css'
      - 'js/sli-contextual-briefs.mjs'
      - 'css/sli-contextual-briefs.css'
      - 'js/sli-sector-context-portal.mjs'
      - 'css/sli-sector-context-portal.css'
      - 'tests/qa-sli-methodology-workbench.mjs'
      - 'js/sli-econometrics.mjs'
      - 'tests/qa-sli-econometrics.mjs'
      - 'tests/qa-sli-econometrics-ui.mjs'
      - 'js/sli-econometrics-report.mjs'
      - 'js/sli-bps-official-panel.mjs'
      - 'js/sli-provincial-data-integrity.mjs'
      - 'js/sli-structural-economy.mjs'
      - 'data/sli-structural-industry-source-register.json'
      - 'data/strategic-map-smelter-2026.json'
      - 'tests/qa-sli-structural-economy.mjs'
      - 'tests/qa-sli-provincial-data-integrity.mjs'
      - 'scripts/verify_bps_panel_statsmodels.py'
      - 'data/sli-bps-regional-intelligence.json'
      - 'tests/qa-sli-official-bps-panel.mjs'
      - 'scripts/audit-sli-content-quality.mjs'
      - 'tests/qa-sli-content-quality.mjs'
      - 'data/sli-research-assistant-config.json'
      - 'js/sli-research-ai.js'
      - 'js/sli-research-analysis.mjs'
      - 'data/sli-research-province-preview.json'
      - 'data/sli-research-evidence-preview.json'
      - 'research-api/**'
      - 'tests/qa-sli-evidence-bridge.mjs'
      - 'tests/qa-sli-hybrid-retrieval.mjs'
      - 'tests/qa-sli-report-audit.mjs'
      - 'tests/qa-sli-source-verification.mjs'
      - 'tests/qa-sli-mineral-corpus.mjs'
      - 'data/energy-fundamentals.json'
      - 'data/energy-prices-fiscal.json'
      - 'data/energy-transition.json'
      - 'data/daily-energy-assessment.json'
      - 'tests/qa-sli-research-quality.mjs'
      - 'js/sli-research-visuals.js'
      - 'tests/qa-sli-research-visuals.mjs'
      - 'tests/qa-sli-research-conversation.mjs'
      - 'tests/qa-sli-research-ai.mjs'
      - 'tests/qa-sli-research-analysis.mjs'
      - 'js/sli-navigation.js'
      - '.github/workflows/sli-research-ai-qa.yml'
permissions:
  contents: read
jobs:
  evidence-research:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check research JavaScript syntax
        run: |
          node --check js/sli-research-assistant.js
          node --check js/sli-analytical-core.mjs
          node --check js/sli-regional-method-engines.mjs
          node --check js/sli-investor-chat.mjs
          node --check js/sli-research-questionnaire.mjs
          node --check js/sli-econometrics.mjs
          node --check js/sli-econometrics-report.mjs
          node --check js/sli-bps-official-panel.mjs
          node --check js/sli-provincial-data-integrity.mjs
          node --check js/sli-structural-economy.mjs
          node --check js/sli-analytical-workbench-ui.mjs
          node --check js/sli-contextual-briefs.mjs
          node --check js/sli-sector-context-portal.mjs
          node --check js/sli-research-visuals.js
          node --check research-api/src/chart-data.mjs
          node --check research-api/src/assistant-core.mjs
          node --check research-api/src/evidence-bridge.mjs
          node --check research-api/src/hybrid-retrieval.mjs
          node --check research-api/src/report-audit.mjs
          node --check research-api/src/source-verification.mjs
          node --check research-api/src/energy-corpus.mjs
          node --check research-api/src/mineral-corpus.mjs
          node --check research-api/src/monitoring-context.mjs
          node --check js/sli-research-ai.js
          node --check js/sli-research-analysis.mjs
          node --check research-api/src/index.js
          node --check research-api/src/owner-test-worker.mjs
          node --check research-api/src/core.mjs
      - name: Install DOM smoke-test runner
        run: npm install --no-save --no-audit --no-fund jsdom@26
      - name: Validate open evidence, secure planned RAG and traceability
        run: node --test tests/qa-sli-mineral-corpus.mjs tests/qa-sli-source-verification.mjs tests/qa-sli-report-audit.mjs tests/qa-sli-hybrid-retrieval.mjs tests/qa-sli-evidence-bridge.mjs tests/qa-sli-regional-method-engines.mjs tests/qa-sli-research-quality.mjs tests/qa-sli-research-questionnaire.mjs tests/qa-sli-investor-chat.mjs tests/qa-sli-structural-economy.mjs tests/qa-sli-provincial-data-integrity.mjs tests/qa-sli-official-bps-panel.mjs tests/qa-sli-econometrics.mjs tests/qa-sli-methodology-workbench.mjs tests/qa-sli-research-brand.mjs tests/qa-sli-research-visuals.mjs tests/qa-sli-owner-test.mjs tests/qa-sli-research-conversation.mjs tests/qa-sli-research-ai.mjs tests/qa-sli-research-analysis.mjs tests/qa-sli-content-quality.mjs
      - name: Browser-like econometrics integration smoke
        run: node --test tests/qa-sli-econometrics-ui.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent econometric verifier
        run: python -m pip install --disable-pip-version-check --quiet "statsmodels==0.14.6" "scipy==1.16.2"
      - name: Independently cross-check BPS FE estimates against statsmodels
        run: python scripts/verify_bps_panel_statsmodels.py
