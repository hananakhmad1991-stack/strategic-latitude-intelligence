name: SLI Professional Report Export QA
on:
  pull_request:
    paths:
      - "js/sli-report-*.mjs"
      - "js/sli-research-assistant.js"
      - "sli-research-ai.html"
      - "tests/qa-sli-report-export.mjs"
      - ".github/workflows/sli-report-export-qa.yml"
  push:
    branches: [main]
    paths:
      - "js/sli-report-*.mjs"
      - "js/sli-research-assistant.js"
      - "sli-research-ai.html"
      - "tests/qa-sli-report-export.mjs"
      - ".github/workflows/sli-report-export-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  professional-report-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check report modules and existing Research UI syntax
        run: |
          node --check js/sli-report-content.mjs
          node --check js/sli-report-docx.mjs
          node --check js/sli-report-pdf.mjs
          node --check js/sli-report-buttons.mjs
          node --check js/sli-research-assistant.js
      - name: Test APA 7 source rules, page layout and Word OOXML
        run: node --test tests/qa-sli-report-export.mjs
      - name: Verify HTML export buttons and module scripts are present
        run: |
          python - <<'PY'
          from pathlib import Path
          site=Path("sli-research-ai.html").read_text(encoding="utf-8")
          body=Path("js/sli-research-assistant.js").read_text(encoding="utf-8")
          for part in ('id="raWord"', 'id="raPdf"', 'sli-report-buttons.mjs'):
              assert part in site, f"Missing research export integration: {part}"
          assert 'getExportData' in body
          print("Professional report export UI wired")
          PY
