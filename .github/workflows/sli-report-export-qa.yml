name: SLI Professional Report Export QA
on:
  pull_request:
    paths:
      - "js/sli-report-*.mjs"
      - "js/sli-research-assistant.js"
      - "sli-research-ai.html"
      - "tests/qa-sli-report-export.mjs"
      - "tests/qa-sli-legal-source-limited.mjs"
      - "tests/qa-sli-owner-handler-acceptance.mjs"
      - ".github/workflows/sli-report-export-qa.yml"
  push:
    branches: [main]
    paths:
      - "js/sli-report-*.mjs"
      - "js/sli-research-assistant.js"
      - "sli-research-ai.html"
      - "tests/qa-sli-report-export.mjs"
      - "tests/qa-sli-legal-source-limited.mjs"
      - "tests/qa-sli-owner-handler-acceptance.mjs"
      - ".github/workflows/sli-report-export-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  professional-report-exports:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check report modules and existing Research UI syntax
        run: |
          node --check js/sli-report-content.mjs
          node --check js/sli-report-docx.mjs
          node --check js/sli-report-pdf.mjs
          node --check js/sli-report-buttons.mjs
          node --check js/sli-research-assistant.js
      - name: Test APA 7 source rules, page layout and Word OOXML
        run: node --test tests/qa-sli-report-export.mjs tests/qa-sli-legal-source-limited.mjs tests/qa-sli-owner-handler-acceptance.mjs
      - name: Validate actual Word ZIP CRC and XML using Python
        run: |
          node --input-type=module -e '
          import {makeResearchReport} from "./js/sli-report-content.mjs";
          import {docxBytes} from "./js/sli-report-docx.mjs";
          import {writeFileSync} from "node:fs";
          const s={publisher:"Official Institute",title:"Research report",source_date:"2026-10-20",source_url:"https://www.esdm.go.id/reports/primary.pdf"};
          const r=makeResearchReport({answer:"# Test title\n\n## Finding\n\nOfficial evidence [1].",sources:[s]});
          writeFileSync("/tmp/sli-professional-smoke.docx",docxBytes(r));
          '
          python - <<'PY'
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          path="/tmp/sli-professional-smoke.docx"
          with ZipFile(path) as z:
              assert z.testzip() is None, "DOCX corrupted: CRC check failed"
              for part in ("[Content_Types].xml","word/document.xml","word/styles.xml","word/header1.xml","word/footer1.xml","word/_rels/document.xml.rels"):
                  ET.fromstring(z.read(part))
              styles=z.read("word/styles.xml").decode()
              doc=z.read("word/document.xml").decode()
              assert "Arial" in styles and 'w:val="both"' in styles
              assert "DRAF" in doc and "PAGE" in z.read("word/footer1.xml").decode()
          print("OOXML ZIP, CRC, and mandatory XML parts validated")
          PY
      - name: Verify HTML export buttons and module scripts are present
        run: |
          python - <<'PY'
          from pathlib import Path
          site=Path("sli-research-ai.html").read_text(encoding="utf-8")
          body=Path("js/sli-research-assistant.js").read_text(encoding="utf-8")
          for part in ('id="raWord"', 'id="raPdf"', 'sli-report-buttons.mjs'):
              assert part in site, f"Missing research export integration: {part}"
          assert 'getExportData' in body
          print("Professional report export UI wired")
          PY
