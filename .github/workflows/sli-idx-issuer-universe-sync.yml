name: SLI IDX Issuer Universe Sync
on:
  schedule:
    - cron: '0 22 * * 0' # Monday 05:00 WIB
  workflow_dispatch:
  push:
    paths:
      - 'data/sli-idx-issuer-universe.json'
      - 'scripts/sync_sli_idx_issuers.py'
      - 'scripts/reindex_sli_issuers.py'
      - 'data/site-search-index.json'
      - 'tests/test_sli_idx_issuers.py'
      - '.github/workflows/sli-idx-issuer-universe-sync.yml'
  pull_request:
    paths:
      - 'data/sli-idx-issuer-universe.json'
      - 'scripts/sync_sli_idx_issuers.py'
      - 'scripts/reindex_sli_issuers.py'
      - 'data/site-search-index.json'
      - 'tests/test_sli_idx_issuers.py'
      - '.github/workflows/sli-idx-issuer-universe-sync.yml'
permissions:
  contents: write
concurrency:
  group: sli-idx-universe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate saved data, official snapshot invariants and no invented market cap
        run: |
          python scripts/sync_sli_idx_issuers.py --validate-only
          python -m unittest discover -s tests -p 'test_sli_idx_issuers.py' -v
          python scripts/reindex_sli_issuers.py --check
      - name: Pull public IDX directory with safe error handling
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          python scripts/sync_sli_idx_issuers.py || {
            status=$?
            if [ "$status" -eq 2 ]; then
              echo '::warning::Official IDX endpoint unavailable. Previous catalogue retained; do not label seed as verified.'
            else
              exit "$status"
            fi
          }
      - name: Rebuild global search IDX ticker deep links
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: python scripts/reindex_sli_issuers.py
      - name: Commit verified directory snapshot if changed
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          if git diff --quiet -- data/sli-idx-issuer-universe.json data/site-search-index.json; then
            echo 'No official directory updates'
            exit 0
          fi
          python scripts/sync_sli_idx_issuers.py --validate-only
          python scripts/reindex_sli_issuers.py --check
          git config user.name 'sli-idx-source-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/sli-idx-issuer-universe.json data/site-search-index.json
          git commit -m 'data(idx): source-confirmed official issuer names and tickers'
          git push origin HEAD:main
