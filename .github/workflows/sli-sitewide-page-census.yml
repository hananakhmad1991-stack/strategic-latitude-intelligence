name: SLI All-Page Navigation & Source UX Census
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '*.html'
      - 'js/sli-navigation.js'
      - 'scripts/audit-sli-site-links.mjs'
      - '.github/workflows/sli-sitewide-page-census.yml'
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'js/sli-navigation.js'
      - 'scripts/audit-sli-site-links.mjs'
      - '.github/workflows/sli-sitewide-page-census.yml'
permissions:
  contents: read
jobs:
  static-page-census:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check scripts/audit-sli-site-links.mjs
      - name: Inventory every root HTML page and its relative links
        run: node scripts/audit-sli-site-links.mjs
      - name: Upload source-code audit for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sli-all-page-source-audit
          path: sli-site-links-audit.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Clearly state boundary
        run: echo "Static source census does not verify browser rendering, dynamic links, original-data completeness, licensing, or mobile widget behavior."
