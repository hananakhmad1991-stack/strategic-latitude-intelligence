name: SLI Energy Actor Verification
on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - scripts/energy_actor_watch.py
      - js/energy-governance-ccs.js
      - js/stakeholder-map.js
      - css/stakeholder-map.css
      - .github/workflows/energy-actor-watch.yml
permissions:
  contents: write
concurrency:
  group: sli-energy-actors
  cancel-in-progress: false
jobs:
  validate_official_roster:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan official government leadership sources
        run: python scripts/energy_actor_watch.py
      - name: Validate status, actor roster and dashboard JavaScript
        run: |
          python -m json.tool data/energy-actors-status.json > /dev/null
          python -m json.tool data/energy-governance-ccs.json > /dev/null
          node --check js/energy-governance-ccs.js
          node --check js/stakeholder-map.js
          python - <<'PY'
          import json
          d=json.load(open("data/energy-governance-ccs.json",encoding="utf-8"))
          groups=d["governance"]["layers"]
          names=[x["name"] for layer in groups for x in layer["actors"]]
          assert len(groups)>=6 and len(names)>=50 and len(set(names))==len(names)
          for x in ("Penasihat Khusus Presiden Bidang Energi","PT Pertamina (Persero) — parent company",
                    "DPR RI · Komisi XII — energi, SDA, lingkungan, investasi",
                    "DPD RI · Komite II — resources, energy, infrastructure"):
              assert x in names,x
          assert len(d["governance"]["accountability_routes"])>=7
          assert len(d["governance"]["layers"])==6
          assert "scope" in d["governance"]["layers"][2]["actors"][0]
          ui=open("index.html",encoding="utf-8").read()
          assert "js/stakeholder-map.js" in ui and "css/stakeholder-map.css" in ui
          with open("js/energy-governance-ccs.js",encoding="utf-8") as view:
              assert "window.renderSLIStakeholderMap(" in view.read(), "Stakeholder visualization integration missing"
          print("Validated governance map:",len(names),"unique actors,",len(groups),"branches")
          PY
      - name: Publish monitor status with conflict-safe governance updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/energy-actors-status.json /tmp/sli-actor-status.json
          cp data/energy-governance-ccs.json /tmp/sli-actor-scan.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main || exit 1
            git reset --hard origin/main
            cp /tmp/sli-actor-status.json data/energy-actors-status.json
            python - <<'PY'
          import json
          from pathlib import Path
          current=Path("data/energy-governance-ccs.json")
          scanned=json.loads(Path("/tmp/sli-actor-scan.json").read_text(encoding="utf-8"))
          status=json.loads(Path("/tmp/sli-actor-status.json").read_text(encoding="utf-8"))
          changes=status.get("verified_auto_changes",[])
          if changes:
              data=json.loads(current.read_text(encoding="utf-8"))
              new={a["name"]:a for layer in scanned["governance"]["layers"] for a in layer["actors"]}
              current_actors={a["name"]:a for layer in data["governance"]["layers"] for a in layer["actors"]}
              for change in changes:
                  name=change.get("actor")
                  if name not in new or name not in current_actors: continue
                  src=new[name];dst=current_actors[name]
                  if dst.get("verified","")>src.get("verified",""):continue
                  for key in ("person_name","lead","source","verified","verification_status"):
                      if key in src:dst[key]=src[key]
              current.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            git add data/energy-actors-status.json data/energy-governance-ccs.json
            if git diff --cached --quiet; then echo "Already current"; exit 0; fi
            git commit -m "Refresh source-verified energy actor monitoring"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent change; retry on current main"
            sleep $((attempt * 2))
          done
          echo "Could not publish after retries"
          exit 1
