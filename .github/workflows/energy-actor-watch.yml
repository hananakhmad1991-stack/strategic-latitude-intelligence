name: SLI Energy Actor Verification
on:
  workflow_dispatch:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  push:
    branches: [main]
    paths:
      - scripts/energy_actor_watch.py
      - js/energy-governance-ccs.js
      - .github/workflows/energy-actor-watch.yml
permissions:
  contents: write
concurrency:
  group: sli-energy-actors
  cancel-in-progress: false
jobs:
  validate_official_roster:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan official government leadership sources
        run: python scripts/energy_actor_watch.py
      - name: Validate status, actor roster and dashboard JavaScript
        run: |
          python -m json.tool data/energy-actors-status.json > /dev/null
          python -m json.tool data/energy-governance-ccs.json > /dev/null
          node --check js/energy-governance-ccs.js
          python - <<'PY'
          import json
          d=json.load(open("data/energy-governance-ccs.json",encoding="utf-8"))
          groups=d["governance"]["layers"]
          names=[x["name"] for layer in groups for x in layer["actors"]]
          assert len(groups)>=6 and len(names)>=50 and len(set(names))==len(names)
          for x in ("Penasihat Khusus Presiden Bidang Energi","PT Pertamina (Persero) — parent company",
                    "DPR RI · Komisi XII — energi, SDA, lingkungan, investasi",
                    "DPD RI · Komite II — resources, energy, infrastructure"):
              assert x in names,x
          assert len(d["governance"]["accountability_routes"])>=7
          print("Validated governance map:",len(names),"unique actors,",len(groups),"branches")
          PY
      - name: Commit monitored status and only dual-verified leadership changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/energy-actors-status.json data/energy-governance-ccs.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh official energy actor verification and change status"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent update; retry $attempt/5"
            sleep $((attempt * 2))
          done
          echo "Unable to publish institutional verification after 5 attempts"
          exit 1
