name: SLI RUPTL 44 Source-Row Original PDF Proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/verify-ruptl-expanded-original-source-rows.py'
      - 'data/sli-ruptl-expanded-22-annex-source-rows.json'
      - '.github/workflows/sli-ruptl-44-source-row-proof.yml'
permissions:
  contents: read
concurrency:
  group: sli-ruptl-44-source-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-original-44-row-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Install exact PDF table parser
        run: python3 -m pip install --quiet pymupdf==1.26.7
      - name: Fetch full checksum-pinned official RUPTL
        run: |
          mkdir -p /tmp/sli
          curl --retry 2 --retry-delay 3 -L --fail --max-time 195 \
            -o /tmp/sli/ruplt-publisher.pdf 'https://gatrik.esdm.go.id/gatrik/gatrik-api/storage/migrasi/download_index/files/b967d-ruptl-pln-2025-2034-pub-.pdf'
      - name: Audit exact source table cells for all 44 new sample rows
        run: python3 scripts/verify-ruptl-expanded-original-source-rows.py --pdf /tmp/sli/ruplt-publisher.pdf
      - name: Enforce provenance coverage and no actual progress inference
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('artifacts/sli-ruptl-44-original-source-row-proof.json').read_text())
          assert d['checked_source_row_count']==44
          assert d['distinct_geographic_subannexes']==22
          assert d['auto_approved_actual_cod']==0
          assert d['all_rows_accepted_as_reality_evidence'] is False
          assert len({(x['source_table'],x['source_pdf_page'],x['source_row_no']) for x in d['rows']})==44
          print('RUPTL_SOURCE_GRID_44_REVIEW_OK',d['checked_source_row_count'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sli-ruptl-44-source-original-page-proof-review
          path: artifacts/sli-ruptl-44-original-source-row-proof.json
          if-no-files-found: warn
          retention-days: 30
