name: SLI Home 3D Archipelago QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'js/sli-orbit-globe.js'
      - 'css/sli-orbit-globe.css'
      - 'tests/qa-sli-orbit-globe.mjs'
      - 'tests/qa-sli-globe-layout-browser.mjs'
      - '.github/workflows/sli-orbit-globe-qa.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/sli-orbit-globe.js'
      - 'css/sli-orbit-globe.css'
      - 'tests/qa-sli-orbit-globe.mjs'
      - 'tests/qa-sli-globe-layout-browser.mjs'
      - '.github/workflows/sli-orbit-globe-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archipelago-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate globe geometry, JavaScript and Canvas paint
        run: node --test tests/qa-sli-orbit-globe.mjs

  responsive-globe-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate existing Chrome on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CHROME" ]; then echo "Browser not available" >&2; exit 1; fi
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Install lightweight browser driver
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock playwright-core@1.56.1
      - name: Serve the actual homepage
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sli-globe-home.log 2>&1 &
          for attempt in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Check 5 viewport widths and interactive controls in Chrome
        run: node tests/qa-sli-globe-layout-browser.mjs
