name: SLI BPS Gini Ratio QA
on:
  push:
    paths:
      - 'data/sli-bps-gini-2026.json'
      - 'data/sli-bps-regional-intelligence.json'
      - 'gini-inequality.html'
      - 'js/sli-bps-gini-explorer.js'
      - 'tests/qa-sli-bps-gini.mjs'
      - '.github/workflows/sli-bps-gini-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify BPS 38-province Gini and statistical interpretation safeguards
        run: node --test tests/qa-sli-bps-gini.mjs
