name: SLI Customer UI Consistency
on:
  push:
    branches: [main]
    paths:
      - 'sli-*.html'
      - 'js/sli-navigation.js'
      - 'tests/qa-sli-customer-ui.mjs'
      - '.github/workflows/sli-customer-ui-qa.yml'
  workflow_dispatch:
jobs:
  static-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shared navigation and bilingual content
        run: node tests/qa-sli-customer-ui.mjs
