name: SLI Energy Security Editorial and Syntax QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - js/skkmigas-annual-2025.js
      - js/skkmigas-2025-extension.js
      - data/skkmigas-2025-source-extension.json
      - tests/qa-skkmigas-2025-extension.mjs
      - css/skkmigas-annual-2025.css
      - data/skkmigas-annual-2025.json
      - data/skkmigas-2025-figure-catalog.json
      - tests/qa-skkmigas-annual-2025.mjs
      - tests/qa-skkmigas-ui-dom.mjs
      - js/heesi-2025-dashboard.js
      - js/heesi-2025-investor-atlas.js
      - css/heesi-2025-investor-atlas.css
      - data/heesi-2025-investor-atlas.json
      - tests/qa-heesi-investor-atlas.mjs
      - css/heesi-2025-dashboard.css
      - data/heesi-2025-integrated.json
      - tests/qa-heesi-2025.mjs
      - js/energy-news-sectors.js
      - css/energy-news-sectors.css
      - scripts/energy_sector_taxonomy.py
      - scripts/domestic_energy_watch.py
      - scripts/geopolitical_energy_watch.py
      - tests/test_energy_news_sectors.py
      - tests/check-energy-news-sectors.cjs
      - tests/check-i18n.cjs
      - js/i18n-dictionary.js
      - js/i18n.js
      - css/energy-information-architecture.css
      - css/energy-appendix.css
      - js/energy-appendix.js
      - data/energy-appendix.json
      - js/energy-governance-ccs.js
      - js/stakeholder-map.js
      - js/energy-oil-gas-stakeholders.js
      - js/energy-coal-stakeholders.js
      - css/energy-coal-stakeholders.css
      - data/energy-coal-stakeholders.json
      - tests/check-coal-stakeholders.cjs
      - css/stakeholder-map.css
      - css/energy-oil-gas-stakeholders.css
      - data/energy-oil-gas-stakeholders.json
      - data/energy-governance-ccs.json
      - css/energy-governance-ccs.css
      - tests/check-oil-gas-policy.cjs
      - tests/check-oil-gas-stakeholders.cjs
      - js/daily-energy-assessment.js
      - scripts/daily_energy_assessment.py
      - data/daily-energy-assessment.json
      - tests/check-energy-architecture.cjs
      - .github/workflows/energy-security-editorial-qa.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse all Energy Security JavaScript and verify editable layout
        run: |
          node --check js/energy-governance-ccs.js
          node --check js/heesi-2025-dashboard.js
          node --check js/skkmigas-annual-2025.js
          node tests/qa-skkmigas-annual-2025.mjs
          node --check js/skkmigas-2025-extension.js
          node tests/qa-skkmigas-2025-extension.mjs
          node tests/qa-skkmigas-ui-dom.mjs
          node --check js/heesi-2025-investor-atlas.js
          node tests/qa-heesi-investor-atlas.mjs
          node tests/qa-heesi-2025.mjs
          node --check js/energy-news-sectors.js
          node --check js/energy-transition-domestic.js
          node --check js/stakeholder-map.js
          node --check js/energy-oil-gas-stakeholders.js
          node --check js/energy-coal-stakeholders.js
          node --check js/daily-energy-assessment.js
          node --check js/i18n.js
          node --check js/energy-ev.js
          node --check js/energy-biofuels.js
          node --check js/energy-appendix.js
          node tests/check-energy-architecture.cjs
          node tests/check-energy-news-sectors.cjs
          node tests/check-oil-gas-policy.cjs
          node tests/check-oil-gas-stakeholders.cjs
          node tests/check-coal-stakeholders.cjs
          node tests/check-i18n.cjs
      - name: Validate Python generator, historical snapshots and source notation
        run: |
          python -m py_compile scripts/daily_energy_assessment.py scripts/energy_sector_taxonomy.py scripts/domestic_energy_watch.py scripts/geopolitical_energy_watch.py
          python tests/test_energy_news_sectors.py
          python -m json.tool data/daily-energy-assessment.json >/dev/null
          python -m json.tool data/energy-appendix.json >/dev/null
          python -m json.tool data/energy-governance-ccs.json >/dev/null
          python -m json.tool data/energy-oil-gas-stakeholders.json >/dev/null
          python -m json.tool data/energy-coal-stakeholders.json >/dev/null
          python -m json.tool data/domestic-energy.json >/dev/null
          python -m json.tool data/geopolitical-energy.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/daily-energy-assessment.json').read_text())
          assert len(d['points'])==7
          assert not any('Rp10,/litre' in json.dumps(p) for p in d['points'])
          from datetime import date,datetime
          date.fromisoformat(d['assessment_date_wib'])
          datetime.fromisoformat(d['generated_at_utc'].replace('Z','+00:00'))
          print('Dated assessment validates; no malformed numeric string')
          PY
