permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS and source dataset schemas
        run: |
          node --check js/sli-sector-data-library.js
          node --check js/sli-navigation.js
          node --check js/sli-ai-report-evidence.js
          node --check js/sli-environment-wdi.js
          node --check js/sli-bnpb-district-2024.js
          node --check js/sli-bnpb-gis-2025-gate.js
          node --check js/sli-ruptl-esdm-period-plan.js
          node --check js/sli-ruptl-primary-pdf.js
          node --check js/sli-ruptl-provincial-evidence.js
          node --check js/sli-ruptl-progress-event-timeline.js
          node --check js/sli-ruptl-annex-index.js
          node --check js/sli-digitized-ai-figures.js
          node --check js/sli-ai-figure-audit-status.js
          node --check js/sli-provincial-nexus-ui.js
          node --test tests/qa-sli-user-data-visibility.mjs tests/qa-sli-data-library-home-20261020.mjs tests/qa-sli-provincial-bnpb-2025.mjs tests/qa-sli-ai-wdi-source-phase2.mjs tests/qa-sli-ai-digitized-figures.mjs tests/qa-sli-worldbank-digitized-panels.mjs tests/qa-sli-bnpb-district-2024.mjs tests/qa-sli-ruptl-official-period-plan.mjs tests/qa-sli-ruptl-full-official-annex-index.mjs
          node --test tests/qa-sli-ruptl-primary-pdf-digitization.mjs tests/qa-sli-ruptl-provincial-realization-evidence.mjs tests/qa-sli-ruptl-34-annex-monitoring-timeline.mjs tests/qa-sli-ruplt-official-slo-milestones.mjs tests/qa-sli-ruptl-expanded-source-rows.mjs
      - name: Validate every page references a real public source dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inv=json.loads(Path("data/sli-user-dataset-recovery-inventory.json").read_text())
          assert len(inv["datasets"]) >= 12
          for row in inv["datasets"]:
              if row["public_dataset"]:
                  assert Path(row["public_dataset"]).is_file(), row["public_dataset"]
              assert row["main_dashboard"] and row["detail_dashboard"]
          for file in ("sli-sector-data-library.html","js/sli-sector-data-library.js",
                       "css/sli-sector-data-library.css"):
              assert Path(file).is_file(), file
          print("Recovery file paths and dashboard routes valid")
          PY
