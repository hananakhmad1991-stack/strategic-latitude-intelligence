name: SLI Restored Sector Data QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sli-sector-data-library.html'
      - 'index.html'
      - 'ai-intelligence-hub.html'
      - 'climate-environment.html'
      - 'js/sli-ai-report-evidence.js'
      - 'data/sli-ai-stanford-worldbank-foundations-2025-2026.json'
      - 'tests/qa-sli-data-library-home-20261020.mjs'
      - 'js/sli-sector-data-library.js'
      - 'css/sli-sector-data-library.css'
      - 'data/iea-critical-minerals-2026-full-scenarios.json'
      - 'data/sli-user-dataset-recovery-inventory.json'
      - 'tests/qa-sli-user-data-visibility.mjs'
      - 'tests/qa-sli-ai-wdi-source-phase2.mjs'
      - 'data/sli-environment-worldbank-wdi-indonesia.json'
      - 'js/sli-environment-wdi.js'
      - 'data/sli-stanford-2026-digitized-figures.json'
      - 'data/sli-ai-figure-source-audit.json'
      - 'js/sli-ai-figure-audit-status.js'
      - 'js/sli-digitized-ai-figures.js'
      - 'css/sli-digitized-ai-figures.css'
      - 'tests/qa-sli-ai-digitized-figures.mjs'
      - 'css/sli-environment-wdi.css'
      - 'tests/qa-sli-provincial-bnpb-2025.mjs'
      - 'provincial-intelligence.html'
      - 'js/sli-provincial-nexus-ui.js'
      - 'js/sli-navigation.js'
      - 'sli-research-ai.html'
      - '.github/workflows/sli-sector-data-recovery-qa.yml'
  push:
    branches: [main]
    paths:
      - 'sli-sector-data-library.html'
      - 'index.html'
      - 'ai-intelligence-hub.html'
      - 'climate-environment.html'
      - 'js/sli-ai-report-evidence.js'
      - 'data/sli-ai-stanford-worldbank-foundations-2025-2026.json'
      - 'tests/qa-sli-data-library-home-20261020.mjs'
      - 'js/sli-sector-data-library.js'
      - 'css/sli-sector-data-library.css'
      - 'data/iea-critical-minerals-2026-full-scenarios.json'
      - 'data/sli-user-dataset-recovery-inventory.json'
      - 'tests/qa-sli-user-data-visibility.mjs'
      - 'tests/qa-sli-ai-wdi-source-phase2.mjs'
      - 'data/sli-environment-worldbank-wdi-indonesia.json'
      - 'js/sli-environment-wdi.js'
      - 'data/sli-stanford-2026-digitized-figures.json'
      - 'data/sli-ai-figure-source-audit.json'
      - 'js/sli-ai-figure-audit-status.js'
      - 'js/sli-digitized-ai-figures.js'
      - 'css/sli-digitized-ai-figures.css'
      - 'tests/qa-sli-ai-digitized-figures.mjs'
      - 'css/sli-environment-wdi.css'
      - 'tests/qa-sli-provincial-bnpb-2025.mjs'
      - 'provincial-intelligence.html'
      - 'js/sli-provincial-nexus-ui.js'
      - '.github/workflows/sli-sector-data-recovery-qa.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS and source dataset schemas
        run: |
          node --check js/sli-sector-data-library.js
          node --check js/sli-navigation.js
          node --check js/sli-ai-report-evidence.js
          node --check js/sli-environment-wdi.js
          node --check js/sli-digitized-ai-figures.js
          node --check js/sli-ai-figure-audit-status.js
          node --check js/sli-provincial-nexus-ui.js
          node --test tests/qa-sli-user-data-visibility.mjs tests/qa-sli-data-library-home-20261020.mjs tests/qa-sli-provincial-bnpb-2025.mjs tests/qa-sli-ai-wdi-source-phase2.mjs tests/qa-sli-ai-digitized-figures.mjs
      - name: Validate every page references a real public source dataset
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          inv=json.loads(Path("data/sli-user-dataset-recovery-inventory.json").read_text())
          assert len(inv["datasets"]) >= 12
          for row in inv["datasets"]:
              if row["public_dataset"]:
                  assert Path(row["public_dataset"]).is_file(), row["public_dataset"]
              assert row["main_dashboard"] and row["detail_dashboard"]
          for file in ("sli-sector-data-library.html","js/sli-sector-data-library.js",
                       "css/sli-sector-data-library.css"):
              assert Path(file).is_file(), file
          print("Recovery file paths and dashboard routes valid")
          PY
