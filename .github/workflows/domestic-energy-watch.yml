name: SLI Indonesia Domestic Energy Radar
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"
  push:
    branches: [main]
    paths:
      - scripts/domestic_energy_watch.py
      - scripts/energy_sector_taxonomy.py
      - .github/workflows/domestic-energy-watch.yml
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate news taxonomy and collector syntax
        run: |
          python -m py_compile scripts/energy_sector_taxonomy.py scripts/domestic_energy_watch.py
      - name: Scan attributed Indonesian energy / environment releases
        run: python scripts/domestic_energy_watch.py
      - name: Commit dated leads and diagnostic status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/domestic-energy-health.json /tmp/sli-domestic-health.json
          if [ -f data/domestic-energy.json ]; then cp data/domestic-energy.json /tmp/sli-domestic-energy.json; fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main || exit 1
            git reset --hard origin/main
            cp /tmp/sli-domestic-health.json data/domestic-energy-health.json
            if [ -f /tmp/sli-domestic-energy.json ]; then cp /tmp/sli-domestic-energy.json data/domestic-energy.json; fi
            git add data/domestic-energy-health.json data/domestic-energy.json
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Refresh domestic energy and refinery news watch"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
