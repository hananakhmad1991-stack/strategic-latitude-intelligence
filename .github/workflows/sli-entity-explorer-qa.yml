name: SLI Entity Explorer and Unified UX QA
on:
  push:
    paths:
      - 'sli-entities.html'
      - 'js/sli-entity-identity.js'
      - 'js/sli-entities.js'
      - 'js/sli-idx-heatmap.js'
      - 'js/sli-idx-sector-watchlist.js'
      - 'css/sli-idx-sector-watchlist.css'
      - 'js/sli-idx-tradingview.js'
      - 'sli-issuer.html'
      - 'js/sli-issuer.js'
      - 'css/sli-issuer.css'
      - 'tests/qa-sli-idx-provider-dossier.mjs'
      - 'css/sli-idx-heatmap.css'
      - 'data/sli-idx-market-snapshot.json'
      - 'tests/qa-sli-idx-heatmap.mjs'
      - 'tests/qa-sli-idx-provider-dossier.mjs'
      - 'js/sli-corporate-evidence-ui.js'
      - 'css/sli-corporate-evidence.css'
      - 'data/sli-corporate-evidence-relationships.json'
      - 'css/sli-entity-identity.css'
      - 'css/sli-entities.css'
      - 'js/sli-navigation.js'
      - 'js/sector-command-hierarchy.js'
      - 'js/sli-research-ai.js'
      - 'index.html'
      - 'tests/qa-sli-entities.mjs'
      - '.github/workflows/sli-entity-explorer-qa.yml'
  pull_request:
    paths:
      - 'sli-entities.html'
      - 'js/sli-entity-identity.js'
      - 'js/sli-entities.js'
      - 'js/sli-corporate-evidence-ui.js'
      - 'css/sli-corporate-evidence.css'
      - 'data/sli-corporate-evidence-relationships.json'
      - 'css/sli-entity-identity.css'
      - 'css/sli-entities.css'
      - 'js/sli-navigation.js'
      - 'js/sector-command-hierarchy.js'
      - 'js/sli-research-ai.js'
      - 'index.html'
      - 'tests/qa-sli-entities.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check js/sli-entity-identity.js
          node --check js/sli-entities.js
          node --check js/sli-idx-heatmap.js
          node --check js/sli-idx-sector-watchlist.js
          node --check js/sli-idx-tradingview.js
          node --check js/sli-issuer.js
          node --check js/sli-corporate-evidence-ui.js
          node --check js/sli-navigation.js
          node --check js/sector-command-hierarchy.js
          node --check js/sli-research-ai.js
      - name: Entity, shared chrome and data regression tests
        run: |
          node --test tests/qa-sli-corporate-evidence.mjs tests/qa-sli-entities.mjs tests/qa-sli-navigation-chrome.mjs tests/qa-sli-information-architecture.mjs tests/qa-sli-unified-dashboards.mjs tests/qa-sli-home-portal.mjs tests/qa-sli-idx-heatmap.mjs tests/qa-sli-idx-provider-dossier.mjs
          node tests/qa-command-hierarchy.mjs
