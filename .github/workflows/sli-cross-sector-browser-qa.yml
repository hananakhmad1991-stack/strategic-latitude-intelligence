name: SLI Cross-Sector Institutional Browser QA
on:
  pull_request:
    paths:
      - 'data/sli-cross-sector-official-leadership-2026.json'
      - 'js/sli-sector-leadership.js'
      - 'tests/qa-sli-cross-sector-browser.mjs'
      - 'indonesia-macroeconomic-intelligence.html'
      - 'policy-regulatory-intelligence.html'
      - 'geopolitical-impact-assessment.html'
      - 'climate-environment.html'
      - 'sli-entities.html'
      - 'provincial-intelligence.html'
      - '.github/workflows/sli-cross-sector-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cross-sector-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome
        shell: bash
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$CHROME"
          echo "CHROME_BIN=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: Install browser client only
        run: npm install --no-save --ignore-scripts --no-audit --no-fund --no-package-lock playwright-core@1.56.1
      - name: Start local public SLI server
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/sli-ministry-server.log 2>&1 &
          echo $! > /tmp/sli-ministry-server.pid
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/indonesia-macroeconomic-intelligence.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/sli-ministry-server.log
          exit 1
      - name: Test all six institutional dashboards
        run: node tests/qa-sli-cross-sector-browser.mjs
      - name: Stop server
        if: always()
        run: |
          test ! -f /tmp/sli-ministry-server.pid || kill "$(cat /tmp/sli-ministry-server.pid)" || true
