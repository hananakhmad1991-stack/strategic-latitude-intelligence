name: SLI Membership bootstrap · D1 and R2 staging
on:
  push:
    branches:
      - 'feature/sli-membership-session-billing-foundation-20261024'
    paths:
      - 'membership-api/**'
      - '.github/workflows/sli-membership-bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sli-membership-cloudflare-bootstrap
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test membership JWT, revocable sessions, billing and D1 migrations
        run: |
          node --check membership-api/scripts/bootstrap-cloudflare-staging.mjs
          node --test membership-api/tests/auth.test.mjs membership-api/tests/worker-sessions-billing.test.mjs membership-api/tests/research-entitlement.test.mjs membership-api/test/access.test.mjs
          python3 -m unittest discover -s membership-api/tests -p 'test_migration.py' -v
  stage:
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment: sli-membership-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require available Cloudflare deploy credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Cloudflare token missing" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Cloudflare account missing" && exit 1)
      - name: Provision and verify strictly isolated empty D1 and R2
        working-directory: membership-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/bootstrap-cloudflare-staging.mjs
      - name: Apply D1 migrations to staging only
        working-directory: membership-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply DB --remote --config wrangler.bootstrap-stage.json
      - name: Confirm D1 schema migration on remote
        working-directory: membership-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 d1 execute DB --remote --config wrangler.bootstrap-stage.json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('subscriptions','member_sessions','billing_event_audit') ORDER BY name;" > /tmp/membership-d1-schema.txt
          grep -q 'subscriptions' /tmp/membership-d1-schema.txt
          grep -q 'member_sessions' /tmp/membership-d1-schema.txt
          grep -q 'billing_event_audit' /tmp/membership-d1-schema.txt
          echo 'D1 remote staging schema verified.'
      - name: Deploy with D1 and R2 bindings, without real customer authentication or billing
        working-directory: membership-api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.bootstrap-stage.json
      - name: Live fail-closed HTTP smoke
        run: |
          node --input-type=module <<'NODE'
          const base='https://sli-membership-infra-stage.hananakhmad1991.workers.dev';
          const call=(p,opts={})=>fetch(base+p,{redirect:'error',signal:AbortSignal.timeout(20000),...opts});
          const health=await call('/healthz');
          if(health.status!==200||(await health.json()).state!=='prelaunch')throw Error('health fails');
          const me=await call('/v1/me',{headers:{Origin:'https://hananakhmad1991-stack.github.io'}});
          if(me.status!==503)throw Error('identity unexpectedly enabled: HTTP '+me.status);
          const billing=await call('/v1/billing/internal-event',{method:'POST',body:'{}'});
          if(billing.status!==503)throw Error('billing unexpectedly active: HTTP '+billing.status);
          const foreign=await call('/v1/me',{headers:{Origin:'https://malicious.example'}});
          if(foreign.status!==403)throw Error('foreign origin not rejected');
          console.log('LIVE STAGING PASS: health=200, configured identity=503, billing=503, foreign origin=403');
          NODE
      - name: Record proof and launch limitations
        if: always()
        run: |
          echo '## SLI Membership infrastructure staging' >> "$GITHUB_STEP_SUMMARY"
          echo 'Read each deployment step for remote D1 migration, R2 binding and endpoint results.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This Worker has NO Supabase URL and NO billing key; it intentionally denies customer login and payment.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Actual Supabase authentication and payment-provider sandbox require separate provider integration.' >> "$GITHUB_STEP_SUMMARY"
