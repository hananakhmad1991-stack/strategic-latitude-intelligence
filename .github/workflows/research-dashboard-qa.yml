name: SLI Research Dashboard QA
on:
  push:
    paths:
      - 'index.html'
      - 'js/research-chapters.js'
      - 'js/sector-stakeholder-explorer.js'
      - 'css/stakeholder-map.css'
      - 'data/sector-governance-explorer.json'
      - 'tests/qa-sector-organigrams.mjs'
      - 'data/investment-evidence.json'
      - 'tests/qa-research-dashboard.mjs'
      - '.github/workflows/research-dashboard-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and render both specialist modules
        run: |
          node tests/qa-research-dashboard.mjs
          node tests/qa-sector-organigrams.mjs
