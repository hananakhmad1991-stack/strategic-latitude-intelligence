name: SLI Research Dashboard QA
on:
  push:
    paths:
      - 'index.html'
      - 'js/research-chapters.js'
      - 'js/iea-2026-explorer.js'
      - 'css/iea-2026-explorer.css'
      - 'data/iea-2026-workbook-dashboard.json'
      - 'data/iea-indonesia-critical-minerals.json'
      - 'tests/qa-iea-2026-workbook.mjs'
      - 'js/source-data-bridge.js'
      - 'css/source-data-bridge.css'
      - 'data/cross-source-policy-2026.json'
      - 'tests/qa-cross-source-evidence.mjs'
      - 'js/smelter-cohort-reconciliation.js'
      - 'css/smelter-cohort-reconciliation.css'
      - 'data/strategic-map-smelter-2026.json'
      - 'tests/qa-smelter-cohort-reconciliation.mjs'
      - 'js/research-signal-radar.js'
      - 'css/research-signal-radar.css'
      - 'data/research-signal-radar.json'
      - 'tests/qa-research-signal-radar.mjs'
      - 'tests/test_research_signal_radar.py'
      - 'js/iea-critical-minerals.js'
      - 'js/usgs-critical-minerals.js'
      - 'js/esdm-2025-mineral-performance.js'
      - 'css/esdm-2025-mineral-performance.css'
      - 'data/esdm-2025-mineral-performance.json'
      - 'tests/qa-esdm-2025-mineral-performance.mjs'
      - 'css/usgs-critical-minerals.css'
      - 'data/usgs-indonesia-minerals-2026.json'
      - 'tests/qa-usgs-critical-minerals.mjs'
      - 'css/iea-critical-minerals.css'
      - 'data/iea-indonesia-critical-minerals.json'
      - 'tests/qa-iea-critical-minerals.mjs'
      - 'js/sector-stakeholder-explorer.js'
      - 'js/sector-command-hierarchy.js'
      - 'js/stakeholder-map.js'
      - 'js/energy-governance-ccs.js'
      - 'js/energy-hierarchy-adapter.js'
      - 'data/energy-governance-ccs.json'
      - 'tests/qa-energy-institution-explorer.mjs'
      - 'css/sector-command-hierarchy.css'
      - 'data/sector-command-hierarchy.json'
      - 'tests/qa-command-hierarchy.mjs'
      - 'css/stakeholder-map.css'
      - 'data/sector-governance-explorer.json'
      - 'tests/qa-sector-organigrams.mjs'
      - 'data/investment-evidence.json'
      - 'tests/qa-research-dashboard.mjs'
      - '.github/workflows/research-dashboard-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile and render both specialist modules
        run: |
          node tests/qa-research-dashboard.mjs
          node --check js/iea-2026-explorer.js
          node tests/qa-iea-2026-workbook.mjs
          node tests/qa-iea-critical-minerals.mjs
          node --check js/source-data-bridge.js
          node tests/qa-cross-source-evidence.mjs
          node --check js/smelter-cohort-reconciliation.js
          node tests/qa-smelter-cohort-reconciliation.mjs
          node --check js/research-signal-radar.js
          node tests/qa-research-signal-radar.mjs
          python -m py_compile scripts/research_signal_radar.py
          python tests/test_research_signal_radar.py
          node tests/qa-iea-critical-minerals.mjs
          node tests/qa-usgs-critical-minerals.mjs
          node tests/qa-esdm-2025-mineral-performance.mjs
          node tests/qa-sector-organigrams.mjs
          node tests/qa-command-hierarchy.mjs
          node tests/qa-energy-institution-explorer.mjs
          python scripts/validate_sector_hierarchy.py
