name: SLI User Intelligence Backend Security QA

on:
  pull_request:
    paths:
      - 'services/sli-user-intelligence/**'
      - '.github/workflows/sli-user-intelligence-source-sync.yml'
      - '.github/workflows/sli-user-intelligence-activate.yml'
      - 'js/sli-user-intelligence-client.js'
      - 'js/sli-user-intelligence-qa.js'
      - 'sli-user-intelligence-qa.html'
      - 'css/sli-user-intelligence.css'
      - 'config/sli-user-intelligence.json'
      - 'sli-issuer.html'
      - 'sli-decision-terminal.html'
      - '.github/workflows/sli-user-intelligence-security.yml'
  push:
    branches: [main]
    paths:
      - 'services/sli-user-intelligence/**'
      - '.github/workflows/sli-user-intelligence-source-sync.yml'
      - '.github/workflows/sli-user-intelligence-activate.yml'
      - 'js/sli-user-intelligence-client.js'
      - 'js/sli-user-intelligence-qa.js'
      - 'sli-user-intelligence-qa.html'
      - 'config/sli-user-intelligence.json'
      - '.github/workflows/sli-user-intelligence-security.yml'

permissions:
  contents: read

jobs:
  security:
    name: Verify Access authentication, D1 isolation and schedule safety
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax and security regression
        run: |
          node --check services/sli-user-intelligence/src/auth.mjs
          node --check services/sli-user-intelligence/src/matcher.mjs
          node --check services/sli-user-intelligence/src/index.mjs
          node --check services/sli-user-intelligence/scripts/build-d1-catalyst-import.mjs
          node --check js/sli-user-intelligence-client.js
          node --check js/sli-user-intelligence-qa.js
          node --test services/sli-user-intelligence/tests/*.test.mjs
          python services/sli-user-intelligence/tests/test_migration.py
      - name: Enforce exact Cloudflare Access pilot origin and no client secrets
        run: |
          python - <<'PY'
          import json
          p=json.load(open('config/sli-user-intelligence.json'))
          assert p['schema_version']=='sli-user-intelligence-client-v1'
          assert p['enabled'] is True, 'Restricted two-account Chrome pilot expected after owner QA'
          assert p['api_base']=='https://sli-user-intelligence.hananakhmad1991.workers.dev/'
          assert p['login_url']==p['api_base']+'api/me'
          assert set(p)=={'schema_version','enabled','api_base','login_url','note'}
          assert all(s not in json.dumps(p).lower() for s in ['authorization','cf_access_aud','secret','bearer','api_token','password'])
          print('Restricted private pilot route and public-only metadata verified')
          PY
