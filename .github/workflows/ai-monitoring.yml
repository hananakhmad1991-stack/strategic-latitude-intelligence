# SLI monitoring recovery: 2026-11-24; source checks and validation retained.
name: SLI AI monitoring and source QA
on:
  workflow_dispatch:
  schedule:
    - cron: '23 2,8,14,20 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-monitoring.yml'
permissions:
  contents: write
concurrency:
  group: sli-ai-monitoring
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh attributed AI monitoring leads
        run: python scripts/update_ai_monitoring.py
      - name: Verify no unsupported states or broken dataset schemas
        run: python scripts/verify_sli_data.py
      - name: Publish only changed source observations
        run: |
          set -eu
          file="data/ai-monitoring.json"
          if [ ! -s "$file" ]; then echo "No valid output"; exit 1; fi
          python -m json.tool "$file" > /dev/null
          snapshot=$(mktemp)
          cp "$file" "$snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$snapshot" "$file"
            git add "$file"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Refresh source-attributed ai-monitoring snapshot"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
