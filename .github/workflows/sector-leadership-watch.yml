name: SLI Sector Leadership Source Watch
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sli-sector-leadership-scan
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official sector leadership sources
        run: python scripts/scan_sector_institution_sources.py
      - name: Verify hierarchy and distinct ownership vs regulation
        run: python scripts/validate_sector_hierarchy.py
      - name: Store attributed source check (not unverified incumbents)
        run: |
          git config user.name "sli-source-watch"
          git config user.email "actions@users.noreply.github.com"
          git add data/sector-leadership-watch.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official sector leadership source freshness"
            git push
          fi
