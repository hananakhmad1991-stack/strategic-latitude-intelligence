name: SLI Food & Agriculture — Source & Dashboard Quality
on:
  workflow_dispatch:
  schedule:
    # Weekly validation of already curated baseline; no claim of live numerical sync.
    - cron: '27 23 * * 0'
  push:
    branches: [main]
    paths:
      - 'food-agriculture-intelligence.html'
      - 'css/food-governance-hierarchy.css'
      - 'js/food-governance-hierarchy.js'
      - 'js/food-governance-tree.js'
      - 'css/food-governance-tree.css'
      - 'data/food-governance-hierarchy.json'
      - 'css/food-agriculture-intelligence.css'
      - 'js/food-agriculture-intelligence.js'
      - 'data/food-agriculture-2026.json'
      - 'data/food-institution-leadership.json'
      - 'scripts/watch_food_officeholders.py'
      - 'tests/test_food_officeholder_watch.py'
      - 'js/sli-navigation.js'
      - 'tests/qa-sli-food-agriculture.mjs'
      - 'scripts/build_food_agriculture.py'
      - '.github/workflows/sli-food-agriculture-source-sync.yml'
permissions:
  contents: read
jobs:
  verify-curated-source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static source/model/UX review
        run: |
          node --check js/food-agriculture-intelligence.js
          node --check js/food-governance-hierarchy.js
          node --check js/food-governance-tree.js
          node --check js/sli-navigation.js
          python -m py_compile scripts/build_food_agriculture.py
          python tests/test_food_officeholder_watch.py
          node --test tests/qa-sli-food-agriculture.mjs
      - name: Disclose PDF source-sync status and newer-publication requirement
        run: |
          echo '## Food & Agriculture publication provenance' >> "$GITHUB_STEP_SUMMARY"
          echo 'June 2026 Kementan 63-table baseline is dated and validated against archived extracted records.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Original June PDF download at Pusdatin returns HTTP 403 from GitHub Actions runner. Automatic numerical promotion of newer editions is **not operational**.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The dashboard does not claim a live October price or auto-updated NTP. To refresh, ingest the newer official PDF through a reviewed, source-backed extraction workflow and rerun tests.' >> "$GITHUB_STEP_SUMMARY"
