name: SLI Food & Agriculture — Official Source Baseline QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_food_agriculture.py'
      - 'tests/test_food_agriculture_snapshot.py'
      - '.github/workflows/sli-food-agriculture-source-sync.yml'
  schedule:
    # Weekly 06:27 WIB: frozen June benchmark only; checks official PDF, no automatic promotion of newer editions.
    - cron: '27 23 * * 0'
permissions:
  contents: write
concurrency:
  group: sli-food-agriculture-official-baseline
  cancel-in-progress: false
jobs:
  validate-publisher-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF table extractors
        run: python -m pip install --disable-pip-version-check --quiet 'PyMuPDF==1.26.5' 'pdfplumber==0.11.7'
      - name: Parse 63 original Pusdatin tables and guard numerical identities
        run: python scripts/build_food_agriculture.py --out data/food-agriculture-june-2026.json
      - name: Validate source-dated sector data schema and coverage
        run: python tests/test_food_agriculture_snapshot.py
      - name: Commit validated source snapshot only when numeric data changed
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- data/food-agriculture-june-2026.json && [ -f data/food-agriculture-june-2026.json ]; then
            echo "No validated source data change."
            exit 0
          fi
          git config user.name 'sli-data-intelligence[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/food-agriculture-june-2026.json
          git diff --cached --quiet && exit 0
          git commit -m 'data(food): publish validated immutable June 2026 Pusdatin baseline [skip ci]'
          git push
