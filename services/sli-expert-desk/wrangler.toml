name = "sli-expert-desk-owner"
main = "src/index.mjs"
compatibility_date = "2026-10-22"
workers_dev = false
# DO NOT add routes, custom_domains, or auto-deploy until Access, privacy and owner signoff.
# CF_EXPERT_DESK_ENABLED intentionally omitted: fail-closed default (503).

[[d1_databases]]
binding = "DB"
database_name = "sli-expert-desk-private"
database_id = "REPLACE_WITH_PRIVATE_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
CF_ALLOWED_ORIGIN = "https://hananakhmad1991-stack.github.io"
# CF_ACCESS_ISSUER, CF_ACCESS_AUD, CF_OWNER_USER_HASH must be configured securely.
# CF_EXPERT_DESK_ENABLED must be "true" only after protected staging and privacy review.
